<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Fit 30 días</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f7d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan Fit">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f2; --surface:#ffffff; --surface2:#eef1e8; --text:#1d2418; --muted:#5d6655;
  --line:#dde2d4; --accent:#3f7d3a; --accent-soft:#e1efdc; --warn:#b5541f; --warn-soft:#fbe9dd;
  --d:#c98a1a; --l:#3f7d3a; --c:#3a5f8f; --s:#8a4f9c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141811; --surface:#1d2219; --surface2:#262c21; --text:#e8ecdf; --muted:#a1aa95;
    --line:#333b2d; --accent:#8cc97f; --accent-soft:#283a24; --warn:#f0a070; --warn-soft:#3a2619;
    --d:#e3b14e; --l:#8cc97f; --c:#86aee0; --s:#c79ad6; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,5vw,44px);margin:0 0 4px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
h2{font-size:18px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--surface2);user-select:none;transition:.15s}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.no input:checked + span{background:var(--warn);border-color:var(--warn)}
.chip.fav input:checked + span{background:var(--d);border-color:var(--d)}
.star{color:var(--d)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.adder{display:flex;gap:8px}.adder input{flex:1;min-width:0}.adder button{flex:none}
.tags{margin-top:10px}.tags:empty{display:none}
.utag{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;font-size:13.5px;color:var(--surface)}
.utag.fav{background:var(--d)}.utag.no{background:var(--warn)}
.utag button{border:none;background:rgba(0,0,0,.18);color:inherit;border-radius:999px;width:22px;height:22px;padding:0;line-height:22px;font-size:13px;cursor:pointer}
.addmsg{font-size:13px;margin:8px 0 0;min-height:0}.addmsg:empty{display:none}.addmsg.err{color:var(--warn)}.addmsg.ok{color:var(--accent)}
input[type=text],input[type=date]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:10px 18px;cursor:pointer}
.primary{background:var(--accent);color:var(--surface)}
.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.07)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.legend b{font-weight:500}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.langs button{padding:5px 10px;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.langs button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.day{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px;cursor:pointer;text-align:left;color:var(--text);font:inherit;font-weight:400;display:flex;flex-direction:column;gap:3px;transition:.15s}
.day:hover{border-color:var(--accent);transform:translateY(-1px)}
.day.empty{background:transparent;border:none;cursor:default;transform:none}
.day .num{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.day .num em{font-style:normal;font-weight:500;color:var(--muted);font-size:11px}
.meal{font-size:11.5px;line-height:1.3;padding-left:7px;border-left:3px solid;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.today{outline:2px solid var(--accent)}
dialog{border:none;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
.dlg-body{padding:6px 20px 20px}
.recipe{padding:14px 0;border-bottom:1px solid var(--line)}
.recipe:last-child{border:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.recipe h4{margin:2px 0 6px;font-size:17px}
.macro{font-size:13px;color:var(--muted)}
.recipe ul{margin:8px 0;padding-left:18px}
.recipe p{margin:6px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--surface)}
.shop{columns:2 240px;gap:24px;padding-left:18px;margin:6px 0 0}
.shop li{break-inside:avoid;margin-bottom:4px}
.shop li span{color:var(--muted);font-size:12.5px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sec-head h2{margin:0 0 4px}
.toggle{flex:none;width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:16px;line-height:1}
.chev{display:inline-block;transition:transform .2s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .sec-body,.card.closed .sec-head .hint{display:none}
.sec-body{margin-top:14px}
.small{padding:7px 14px;font-size:13px}
.day.ok{background:var(--accent-soft);border-color:var(--accent)}
.day.ko{background:var(--warn-soft);border-color:var(--warn)}
.marks{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.mk{flex:1;padding:4px 0;font-size:12px;font-weight:600;border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.mk.y.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mk.n.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.dlg-marks{display:flex;gap:8px;margin:12px 0 4px}
.dlg-marks .mk{flex:none;padding:8px 14px;font-size:13.5px}
.bars{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 12px;align-items:center}
.bars .lbl{font-size:13.5px;color:var(--text);text-align:right}
.bars .track{position:relative;height:22px;cursor:default}
.bars .bar{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.bars .track:hover .bar{filter:brightness(1.12)}
.bars .val{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);padding-left:6px;white-space:nowrap}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow)}
.money{display:flex;align-items:center;gap:8px}
.money input{max-width:140px}
.money span{color:var(--muted);font-size:13.5px;white-space:nowrap}
.money b{font-weight:500}
.budget-bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.budget-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.budget-bar.over i{background:var(--warn)}
.okmsg{color:var(--accent);font-weight:600}
.overmsg{color:var(--warn);font-weight:600}
.shop-total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;margin-top:6px}
.cost{color:var(--muted);font-size:12.5px}
/* --- novedades --- */
input[type=number],select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.people input{max-width:90px}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:13px}
.calc{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px}
.calc .f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.calc input,.calc select{width:100%;min-width:0}
.calc .res{font-size:13.5px;margin:0}
.swapbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.swapbar a{font-size:13px;color:var(--accent);font-weight:600}
.swaplist{display:grid;gap:6px;margin:10px 0;max-height:280px;overflow:auto;padding:2px}
.swaplist button{text-align:left;font-weight:500;background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:8px 12px}
.swaplist button small{color:var(--muted);font-weight:400}
.swaplist button:hover{border-color:var(--accent)}
.swtag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.mbar{display:flex;height:6px;border-radius:999px;overflow:hidden;margin:6px 0 2px;max-width:260px;gap:2px}
.mbar i{display:block;height:100%}
.shop-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.aisles{columns:2 280px;gap:28px;margin-top:14px}
.aisle{break-inside:avoid;margin-bottom:16px}
.aisle h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.slist label{flex:1;display:flex;gap:8px;align-items:baseline;cursor:pointer;min-width:0}
.slist input{accent-color:var(--accent);width:17px;height:17px;flex:none;align-self:center}
.slist .amt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.slist .cost{white-space:nowrap}
.slist li.got .nm,.slist li.got .amt{text-decoration:line-through;opacity:.55}
.pbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px;line-height:1.2;flex:none}
.pantry{margin-top:6px;padding:12px 14px;background:var(--surface2);border-radius:12px}
.pantry h4{margin:0 0 4px;font-size:14px}
.pantry .chips{margin-top:8px}
.ptag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.ptag button{border:none;background:var(--surface2);color:var(--text);border-radius:999px;width:22px;height:22px;padding:0;font-size:12px}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.pform label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.pform input{width:100%;min-width:0}
.pchart{margin-top:10px;position:relative}
.pchart svg{width:100%;height:230px;display:block;overflow:visible}
.pchart .grid line{stroke:var(--line)}
.pchart text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
.ptable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.ptable th,.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{color:var(--muted);font-weight:600;font-size:12px}
.ptable button{background:none;border:none;color:var(--muted);padding:2px 6px;font-size:13px}
.tablewrap{overflow-x:auto}
.install{display:none}
.install.on{display:inline-block}
.ioshint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media (max-width:520px){.calc .f3{grid-template-columns:1fr 1fr}}
footer{color:var(--muted);font-size:12.5px;margin-top:28px;text-align:center}
.wk-nav{display:none;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
.wk-nav button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit}
.wk-nav button:disabled{opacity:.35;cursor:default}
@media (max-width:760px){
  .cal{grid-template-columns:1fr}
  .dow,.day.empty{display:none}
  .wk-nav{display:flex}
  .day.off{display:none}
  .day{min-height:auto}
  .meal{-webkit-line-clamp:1}
}
@media print{
  #prefs,.row,.tabs,footer,.toggle,.marks,.shop-tools,.pbtn,.pantry,[data-sec=progress],.wk-nav,#langs,.authbar,.install,.ioshint,.cal-tools{display:none!important}
  .day.off{display:flex!important}
  .slist input{display:none}
  .card.closed .sec-body{display:block}
  body{background:#fff}
  .card{box-shadow:none;border:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="langs" id="langs"></div>
  <h1 data-i="title"></h1>
  <p data-i="subtitle"></p>
  <div class="row" style="margin-top:12px">
    <button class="ghost small" id="openAll" data-i="openAll"></button>
    <button class="ghost small" id="closeAll" data-i="closeAll"></button>
    <button class="primary small install" id="installBtn" data-i="install"></button>
  </div>
  <p class="ioshint" id="iosHint" hidden></p>
</header>

<section class="card" id="prefs" data-sec="prefs">
  <div class="sec-head"><div><h2 data-i="s1"></h2><p class="hint" data-i="s1hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
  <div class="grid2">
    <fieldset><legend data-i="diet"></legend><div class="chips" id="diet"></div></fieldset>
    <fieldset><legend data-i="goal"></legend><div class="chips" id="goal"></div></fieldset>
    <fieldset><legend data-i="protLvl"></legend><div class="chips" id="prot"></div></fieldset>
    <fieldset><legend data-i="calLvl"></legend><div class="money"><input type="number" id="kcalTarget" min="800" max="6000" step="50" inputmode="numeric"><span data-i="kcalUnit"></span></div><p class="hint" style="margin:6px 0 0" data-i="kcalHint"></p>
      <button type="button" class="linkbtn" id="calcToggle" data-i="calc"></button>
      <div class="calc" id="calcBox" hidden>
        <div class="chips" id="sexChips"></div>
        <div class="f3"><label><span data-i="age"></span><input type="number" id="cAge" min="14" max="99" inputmode="numeric"></label><label><span data-i="height"></span><input type="number" id="cH" min="120" max="230" inputmode="numeric"></label><label><span data-i="weight"></span><input type="number" id="cW" min="30" max="300" step="0.1" inputmode="decimal"></label></div>
        <label style="font-size:12.5px;color:var(--muted);display:grid;gap:4px"><span data-i="activity"></span><select id="cAct"></select></label>
        <p class="res" id="calcRes"></p>
        <div><button type="button" class="primary small" id="calcUse" data-i="calcUse"></button></div>
        <p class="hint" style="margin:0" data-i="calcNote"></p>
      </div></fieldset>
    <fieldset><legend data-i="people"></legend><div class="money people"><input type="number" id="people" min="1" max="12" step="1" inputmode="numeric"><span data-i="peopleUnit"></span></div><p class="hint" style="margin:6px 0 0" data-i="peopleHint"></p></fieldset>
    <fieldset><legend data-i="meals"></legend><div class="chips" id="meals"></div></fieldset>
    <fieldset><legend data-i="start"></legend><input type="date" id="start"></fieldset>
    <fieldset><legend data-i="budget"></legend><div class="money"><input type="number" id="budget" min="0" step="5" inputmode="decimal"><span><span id="cur">€</span> / <b data-i="weekLow"></b></span></div></fieldset>
    <fieldset><legend data-i="country"></legend><div class="chips" id="country"></div></fieldset>
  </div>
  <fieldset style="margin-top:20px"><legend data-i="dislikes"></legend><div class="chips" id="dislikes"></div></fieldset>
  <fieldset style="margin-top:20px"><legend data-i="favs"></legend><div class="chips" id="favs"></div></fieldset>
  <fieldset style="margin-top:16px"><legend data-i="otherFavs"></legend><div class="adder"><input type="text" id="customFavIn" autocomplete="off"><button type="button" class="ghost" id="customFavAdd" data-i="addBtn"></button></div><input type="hidden" id="customFav"><div class="chips tags" id="customFavTags"></div><p class="addmsg" id="customFavMsg" role="status"></p></fieldset>
  <fieldset style="margin-top:16px"><legend data-i="otherAvoid"></legend><div class="adder"><input type="text" id="customIn" autocomplete="off"><button type="button" class="ghost" id="customAdd" data-i="addBtn"></button></div><input type="hidden" id="custom"><div class="chips tags" id="customTags"></div><p class="addmsg" id="customMsg" role="status"></p></fieldset>
  <div class="row">
    <button class="primary" id="gen" data-i="gen"></button>
    <button class="ghost" id="shuffle" data-i="shuffle"></button>
    <button class="ghost" id="reset" data-i="reset"></button>
  </div>
  </div>
</section>

<section class="card" data-sec="summary">
  <div class="sec-head"><h2 data-i="summary"></h2><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body" id="summary"></div>
</section>

<section class="card" data-sec="cal">
  <div class="sec-head">
    <div><h2 data-i="s2"></h2><p class="hint" style="margin:0" data-i="s2hint"></p></div>
    <button class="toggle" aria-expanded="true"><span class="chev">▾</span></button>
  </div>
  <div class="sec-body">
    <div class="legend" style="margin-top:12px">
      <span><i class="dot" style="background:var(--d)"></i><b data-t="d"></b></span>
      <span><i class="dot" style="background:var(--l)"></i><b data-t="l"></b></span>
      <span><i class="dot" style="background:var(--s)"></i><b data-t="s"></b></span>
      <span><i class="dot" style="background:var(--c)"></i><b data-t="c"></b></span>
      <span>✓ <b data-i="doneLbl"></b></span>
      <span>✗ <b data-i="missedLbl"></b></span>
    </div>
    <div class="wk-nav"><button type="button" id="wkPrev" aria-label="◀">◀</button><span id="wkLbl"></span><button type="button" id="wkNext" aria-label="▶">▶</button></div>
    <div class="cal" id="cal"></div>
    <div class="row cal-tools"><button class="ghost small" id="icsBtn" data-i="icsBtn"></button><button class="ghost small" id="printBtn" data-i="printPdf"></button></div>
    <p class="hint cal-tools" style="margin:8px 0 0" data-i="icsHint"></p>
  </div>
</section>

<section class="card" data-sec="chart">
  <div class="sec-head"><div><h2 data-i="s4"></h2><p class="hint" style="margin:0" data-i="s4hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
    <div class="tabs" id="chartTabs"></div>
    <div class="stats" id="chartStats"></div>
    <p class="hint" id="chartNote" style="margin:14px 0 6px"></p>

function priceLine(line){

  const q = line.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)\s*(g|ml|cdas?|cdta|cacito|rebanadas?|puñados?|dientes?|manojo|lata|onzas|rama)?\b/i);
  if(!q) return p[3] != null ? p[3] : 0.08;
  const num = q[1].includes("/") ? (([a,b]) => a/b)(q[1].split("/").map(Number)) : parseFloat(q[1].replace(",","."));
  let grams;
  if(q[2] && /^(g|ml)$/i.test(q[2])) grams = num;
  else if(q[2]) grams = num * (UNITG[q[2].toLowerCase()] || 30);

  return p[3] != null && !p[1] ? p[3] : grams/1000 * p[1];
}

const ingMemo = {};

const QTY_RE = /^(\d+\/\d+|\d+(?:[.,]\d+)?)\s*(g|ml|cdas?|cdta|cacito|rebanadas?|puñados?|dientes?|manojo|lata|onzas|rama)?\b/i;

/* cantidad de una línea (en español): k = g | ml | ud | sl (rebanadas) | cl (dientes); g = gramos aprox. */
function lineAmt(line, ing){
  const q = line.match(QTY_RE); if(!q) return null;
  const n = parseNum(q[1]), u = (q[2]||"").toLowerCase();
  if(u === "g") return {k:"g", v:n, g:n};
  if(u === "ml") return {k:"ml", v:n, g:n};
  if(/^rebanada/.test(u)) return {k:"sl", v:n, g:n*40};
  if(/^diente/.test(u)) return {k:"cl", v:n, g:n*5};
  if(u === "lata") return {k:"ud", v:n, g:n*80};
  if(u){ const g = n*(UNITG[u]||30); return {k:"g", v:g, g}; }
  return {k:"ud", v:n, g:n*((ing && ing[5]) || 100)};
}

const cfMemo = {};
function baseCF(type, idx){
  const key = type+idx; if(key in cfMemo) return cfMemo[key];
  const r = R[type][idx]; let c = 0, f = 0;
  r[4].forEach(l => { const ing = ingOf(l), a = ing && lineAmt(l, ing); if(a){ c += a.g*ing[3]/100; f += a.g*ing[4]/100; } });
  const rest = Math.max(0, r[2] - 4*r[3]), ec = 4*c, ef = 9*f, tot = ec + ef;
  return cfMemo[key] = tot > 0 ? [rest*ec/tot/4, rest*ef/tot/9] : [rest*0.55/4, rest*0.45/9];

const esc = w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

/* receta en el idioma actual: [nombre, flags, kcal, prot, ingredientes, pasos] */
function tr(type, idx){
  const r = R[type][idx];
  const x = state.lang !== "es" && RT[state.lang] && RT[state.lang][type][idx];
  return x ? [x[0], r[1], r[2], r[3], x[1], x[2]] : r;
}
/* texto para buscar: español + idioma actual */
function searchText(type, idx){
  const r = R[type][idx], x = tr(type, idx);
  return norm(r[0] + " " + r[4].join(" ") + " " + x[0] + " " + x[4].join(" "));
}

function chip(container, type, name, value, label, checked, cls=""){

  l.innerHTML = `<input type="${type}" name="${name}" value="${value}" ${checked?"checked":""}><span>${label}</span>`;
  $(container).appendChild(l);
}

const userWords = s => norm(s||"").split(",").map(w=>w.trim()).filter(Boolean);

function allowed(type, idx){
  const rec = R[type][idx];
  let flags = "", words = [];
  state.diet.forEach(d => flags += (DIETS.find(x=>x[0]===d)||["",""])[1]);
  if(state.diet.includes("vegan")) words.push("miel");
  state.dislikes.forEach(id => { const d = DISLIKES.find(x=>x[0]===id); if(d){ flags += d[1]; words.push(...d[2]); } });
  words.push(...userWords(state.custom));
  if([...rec[1]].some(f => flags.includes(f))) return false;
  const text = searchText(type, idx);
  return !words.some(w => wordRe(w).test(text));
}

function isFav(type, idx){
  const key = type+idx+"|"+state.favs.join()+"|"+state.customFav+"|"+state.lang;
  if(key in favCache) return favCache[key];
  return favCache[key] = rawFav(type, idx);
}
function rawFav(type, idx){
  const words = [];
  state.favs.forEach(id => { const f = FAVS.find(x=>x[0]===id); if(f) words.push(...f[1]); });
  words.push(...userWords(state.customFav));
  const text = searchText(type, idx);
  return words.some(w => wordRe(w).test(text));
}

/* cuántas veces entra una receta en cada ronda: favoritos ×3, y según el nivel de proteína */
function weight(type, idx){
  const r = R[type][idx], ratio = r[3]*4 / r[2];
  let w = isFav(type, idx) ? 3 : 1;
  if(state.protein === "mas") w *= ratio >= 0.3 ? 3 : ratio >= 0.2 ? 2 : 1;
  if(state.protein === "menos") w *= ratio < 0.15 ? 3 : ratio < 0.25 ? 2 : 1;
  return w;
}

function rng(seed){ return () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
function shuffle(arr, rand){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* el plan guarda índices de receta, así cambia de idioma sin cambiar el menú */
let plan = [], pools = {};
function generate(){
  const rand = rng(state.seed * 7919 + 13);
  pools = {}; plan = [];
  const queues = {};
  state.meals.forEach(t => { pools[t] = R[t].map((_,i)=>i).filter(i => allowed(t,i)); queues[t] = []; });
  for(let i=0;i<30;i++){
    const day = {};
    state.meals.forEach(t => {
      if(!pools[t].length){ day[t]=null; return; }
      if(!queues[t].length){
        // los favoritos entran 3 veces en cada ronda, así salen más a menudo
        const weighted = pools[t].flatMap(r => Array(weight(t,r)).fill(r));
        const q = shuffle(weighted, rand);
        for(let k=1;k<q.length;k++) if(q[k]===q[k-1]){ const j=q.findIndex((x,idx)=>idx>k && x!==q[k]); if(j>0) [q[k],q[j]]=[q[j],q[k]]; }
        queues[t] = q;
      }
      let pick = queues[t].shift();
      const prev = plan[i-1] && plan[i-1][t];
      if(prev === pick && queues[t].length){ queues[t].push(pick); pick = queues[t].shift(); }
      day[t] = pick;
    });
    plan.push(day);
  }
  fitBudget();
  /* platos cambiados a mano: mandan sobre el generador */
  let sw = false;
  plan.forEach((day,i) => state.meals.forEach(x => { const s = (state.swaps||{})[dkey(i)+"|"+x]; if(s != null && pools[x].includes(s) && day[x] !== s){ day[x] = s; sw = true; } }));
  if(sw && parseFloat(state.budget) > 0) overWeeks = Array.from({length:Math.ceil(30/7)},(_,w)=>w).filter(w => weekCost(w) > budgetFor(w) + 0.01);
}
const isSwapped = (i, x) => { const s = (state.swaps||{})[dkey(i)+"|"+x]; return s != null && plan[i] && plan[i][x] === s; };

const weekDays = w => plan.map((_,k)=>k).slice(w*7, w*7+7);
const dayCost = day => state.meals.reduce((a,x)=>a+(day[x]!=null?cost(x,day[x]):0),0);
const weekCost = w => weekDays(w).reduce((a,k)=>a+dayCost(plan[k]),0);
const budgetFor = w => parseFloat(state.budget) * weekDays(w).length / 7;
let overWeeks = [];
/* cambia las comidas más caras por alternativas más baratas hasta que cada semana entra en el presupuesto */
function fitBudget(){
  overWeeks = [];
  const b = parseFloat(state.budget);
  if(!(b > 0)) return;
  for(let w=0; w<Math.ceil(30/7); w++){
    let guard = 0;
    while(weekCost(w) > budgetFor(w) && guard++ < 200){
      let best = null;
      weekDays(w).forEach(k => state.meals.forEach(x => {
        const cur = plan[k][x]; if(cur==null) return;
        const cc = cost(x,cur);
        const prev = plan[k-1] && plan[k-1][x], next = plan[k+1] && plan[k+1][x];
        const used = new Set(weekDays(w).map(j => plan[j][x]));
        const cands = pools[x].filter(r => r!==prev && r!==next && cost(x,r) < cc - 0.05);
        if(!cands.length) return;
        // preferir alternativas no repetidas en la semana y favoritas
        cands.sort((a,c) => (used.has(a)-used.has(c)) || (isFav(x,c)-isFav(x,a)) || (cost(x,c)-cost(x,a)));
        const alt = cands[0], saving = cc - cost(x,alt);
        if(!best || saving > best.saving) best = {k, x, alt, saving};
      }));
      if(!best) break;
      plan[best.k][best.x] = best.alt;
    }
    if(weekCost(w) > budgetFor(w) + 0.01) overWeeks.push(w);
  }
}

function presetMatch(c, n){
  return c.list.find(it => it[c.lbl].concat([it[0]]).some(l => norm(l).split("/").map(x=>x.trim()).includes(n)) || (it[c.kw]||[]).includes(n));
}
function addTag(k){
  const c = TAGS[k], inp = $(k+"In"), msg = $(k+"Msg"), raw = inp.value.trim();

    const preset = presetMatch(c, n), checked = preset && document.querySelector(`input[name=${c.name}][value="${preset[0]}"]`);
    if(tagList(k).includes(n) || (checked && checked.checked)){ say("addDup", w); continue; }
    const oPreset = presetMatch(o, n), oChecked = oPreset && document.querySelector(`input[name=${o.name}][value="${oPreset[0]}"]`);

/* cantidades de la receta: gramos según objetivo (y proteína) y nº de personas; unidades según personas */
function scaleQty(line, m, isP, n=1){
  if(isP) m *= pFactor();
  const gm = m*n, um = isP ? m*n : n;
  if(/^\d+(?:[.,]\d+)?\s*(g|ml)\b/.test(line))
    return gm===1 ? line : line.replace(/^(\d+(?:[.,]\d+)?)/, x => Math.round(parseFloat(x.replace(",","."))*gm/5)*5);
  const q = line.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)(?=\s)/);
  if(!q || um===1) return line;
  const v = parseNum(q[1])*um;
  return (isP ? String(Math.max(1, Math.round(v))) : fmtCount(v)) + line.slice(q[1].length);
}

  if(b > 0){
    const bw = budgetFor(week), pct = Math.min(100, total/bw*100), over = total > bw + 0.01;
    html += `<span class="${over?"overmsg":"okmsg"}">${over ? `${t("over")} ${money(total-bw)}` : t("within")} · ${money(bw)}</span></div>
      <div class="budget-bar ${over?"over":""}"><i style="width:${pct}%"></i></div><p class="hint" style="margin:0">${Math.round(total/bw*100)} % ${t("ofBudget")}</p>`;
  } else html += `</div>`;
  $("shopTotal").innerHTML = html + `<p class="hint" style="margin:8px 0 0">${t("priceNote")}</p>`;
  $("shopTools").innerHTML = `<button type="button" class="primary small" id="shareWa">${t("shareWa")}</button>${navigator.share ? `<button type="button" class="ghost small" id="shareNat">${t("share")}</button>` : ""}<button type="button" class="ghost small" id="shopPrint">${t("printPdf")}</button><button type="button" class="ghost small" id="uncheck">${t("uncheckAll")}</button>`;
  $("pantry").innerHTML = `<h4>${t("pantry")}</h4><p class="hint" style="margin:0">${state.pantry.length ? t("pantryHint") : t("pantryEmpty")}</p>` +
    (state.pantry.length ? `<div class="chips">${state.pantry.map(id => `<span class="ptag">${escH(pantryName(id))}<button type="button" data-unp="${escH(id)}" aria-label="${t("removeLbl")} ${escH(pantryName(id))}">✕</button></span>`).join("")}</div>` : "");
}

/* exportar el plan a un calendario (.ics, lo importa Google Calendar, Apple y Outlook) */
function icsText(){
  const esc_ = v => String(v).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const fold = l => { const out = []; while(l.length > 74){ out.push(l.slice(0,74)); l = " " + l.slice(74); } out.push(l); return out.join("\r\n"); };
  const now = new Date(), stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const L_ = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Plan Fit//Plan Fit 30//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:"+esc_(t("title"))];
  plan.forEach((day,i) => state.meals.forEach(x => {
    if(day[x] == null) return;
    const r = tr(x, day[x]), d = dayDate(i), [h,mi] = MEAL_TIME[x], es = R[x][day[x]][4];
    const ing = r[4].map((y,k) => "- " + scaleQty(y, mult(), isProtIng(es[k]), ppl())).join("\n");
    L_.push("BEGIN:VEVENT", `UID:planfit-${dkey(i)}-${x}-${day[x]}@plan-fit`, "DTSTAMP:"+stamp, `DTSTART:${ymdC(d)}T${pad(h)}${pad(mi)}00`, "DURATION:PT30M",
      "SUMMARY:"+esc_(`${TYPES[x][L()]}: ${r[0]}`), "DESCRIPTION:"+esc_(`${ing}\n\n${r[5]}`), "END:VEVENT");
  }));
  L_.push("END:VCALENDAR");
  return L_.map(fold).join("\r\n");
}
$("icsBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsText()], {type:"text/calendar"}));
  a.download = "plan-fit.ics"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
};
$("printBtn").onclick = printPlan;

/* calculadora de calorías (Mifflin-St Jeor) */
const ACT = [1.2, 1.375, 1.55, 1.725, 1.9];
const GOAL_ADJ = {perder:0.8, mantener:1, ganar:1.1};
function calcKcal(){
  const p = state.profile || {}, a = +p.age, h = +p.h, w = +p.w;
  if(!(a > 0 && h > 0 && w > 0)) return null;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (ACT[p.act ?? 1] || 1.375);
  const goal = (document.querySelector('input[name=goal]:checked')||{}).value || state.goal;
  const k = Math.max(p.sex === "m" ? 1500 : 1200, Math.round(tdee * (GOAL_ADJ[goal]||1) / 50) * 50);
  return {b: Math.round(bmr), t: Math.round(tdee), k};
}
function readCalc(){
  state.profile = {sex: (document.querySelector('input[name=sex]:checked')||{}).value || "f", age: $("cAge").value, h: $("cH").value, w: $("cW").value, act: +$("cAct").value};
}
function renderCalc(){
  const c = calcKcal();
  $("calcRes").innerHTML = c ? t("calcRes").replace("{b}",c.b).replace("{t}",c.t).replace("{k}",c.k) : t("calcMissing");
  $("calcUse").disabled = !c;
}
function buildCalc(){
  const p = state.profile || {}, li = L();
  $("sexChips").innerHTML = "";
  chip("sexChips","radio","sex","f",t("sexF"),(p.sex||"f")==="f");
  chip("sexChips","radio","sex","m",t("sexM"),p.sex==="m");
  $("cAct").innerHTML = UI.acts[li].map((l,k) => `<option value="${k}" ${(p.act ?? 1)===k?"selected":""}>${l}</option>`).join("");
  $("cAge").value = p.age || ""; $("cH").value = p.h || "";
  const lastW = (state.progress||[]).filter(e => e.w).slice(-1)[0];
  $("cW").value = p.w || (lastW ? lastW.w : "");
  renderCalc();
}
$("calcToggle").onclick = () => { $("calcBox").hidden = !$("calcBox").hidden; if(!$("calcBox").hidden) buildCalc(); };
$("calcBox").addEventListener("input", () => { readCalc(); renderCalc(); save(); });

/* progreso: peso y medidas */
const PFIELDS = [["w","weight","kg"],["waist","waist","cm"],["hip","hip","cm"],["chest","chest","cm"]];
let pMetric = "w";
const numFmt = (v, d=1) => (+v).toLocaleString(LOCALE[state.lang], {maximumFractionDigits:d});
function renderProgress(){
  const li = L(), list = (state.progress||[]).slice().sort((a,b) => a.d.localeCompare(b.d));
  if(!$("pDate").value) $("pDate").value = new Date().toISOString().slice(0,10);
  const avail = PFIELDS.filter(f => list.some(e => e[f[0]] != null));
  if(!avail.find(f => f[0] === pMetric) && avail.length) pMetric = avail[0][0];
  const lab = f => t(f[1]).replace(/\s*\(.*\)/,"");
  $("pTabs").innerHTML = avail.length > 1 ? avail.map(f => `<button class="ghost ${f[0]===pMetric?"on":""}" data-m="${f[0]}">${lab(f)}</button>`).join("") : "";
  const F = PFIELDS.find(f => f[0] === pMetric), pts = list.filter(e => e[pMetric] != null);
  if(!pts.length){ $("pStats").innerHTML = ""; $("pChart").innerHTML = `<p class="hint">${t("noEntries")}</p>`; $("pTable").innerHTML = ""; return; }
  const first = pts[0][pMetric], last = pts[pts.length-1][pMetric], diff = last - first, unit = F[2];
  const h = +((state.profile||{}).h);
  $("pStats").innerHTML = `<div class="stat"><b>${numFmt(first)} ${unit}</b><small>${t("pStart")} · ${fmt(new Date(pts[0].d+"T12:00:00"),{day:"numeric",month:"short"})}</small></div>
    <div class="stat"><b>${numFmt(last)} ${unit}</b><small>${t("pNow")} · ${fmt(new Date(pts[pts.length-1].d+"T12:00:00"),{day:"numeric",month:"short"})}</small></div>
    <div class="stat"><b>${diff>0?"+":diff<0?"−":""}${numFmt(Math.abs(diff))} ${unit}</b><small>${t("pChange")}</small></div>
    ${pMetric==="w" && h > 0 ? `<div class="stat"><b>${numFmt(last/((h/100)**2))}</b><small>${t("bmi")}</small></div>` : ""}`;
  $("pChart").innerHTML = pts.length < 2 ? `<p class="hint">${t("needTwo")}</p>` : progressSVG(pts, F, lab(F));
  $("pTable").innerHTML = `<thead><tr><th>${t("date")}</th>${PFIELDS.map(f => `<th>${t(f[1])}</th>`).join("")}<th></th></tr></thead><tbody>` +
    list.slice().reverse().map(e => `<tr><td>${fmt(new Date(e.d+"T12:00:00"),{day:"numeric",month:"short",year:"numeric"})}</td>${PFIELDS.map(f => `<td>${e[f[0]] != null ? numFmt(e[f[0]]) : "—"}</td>`).join("")}<td><button type="button" data-del="${e.d}" title="${t("del")}" aria-label="${t("del")}">✕</button></td></tr>`).join("") + `</tbody>`;
}
function progressSVG(pts, F, label){
  const W = Math.max(280, Math.round($("pChart").clientWidth || 640)), H = 230, ml = 44, mr = 14, mt = 14, mb = 28, key = F[0];
  const xs = pts.map(e => new Date(e.d+"T12:00:00").getTime()), ys = pts.map(e => e[key]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const padY = Math.max(0.5, (hi-lo)*0.15); lo -= padY; hi += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), X = v => ml + (x1===x0 ? 0.5 : (v-x0)/(x1-x0)) * (W-ml-mr), Y = v => mt + (1-(v-lo)/(hi-lo)) * (H-mt-mb);
  const ticks = Array.from({length:4},(_,k) => lo + (hi-lo)*(k+0.5)/4);
  const xl = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,k,a) => a.indexOf(v)===k);
  const path = pts.map((e,k) => (k?"L":"M") + X(xs[k]).toFixed(1) + " " + Y(ys[k]).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("pChartAria")} ${label}">
    <g class="grid">${ticks.map(v => `<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${numFmt(v)}</text>`).join("")}</g>
    ${xl.map(k => `<text x="${X(xs[k])}" y="${H-8}" text-anchor="${k===0?"start":k===pts.length-1?"end":"middle"}">${fmt(new Date(xs[k]),{day:"numeric",month:"short"})}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((e,k) => `<circle cx="${X(xs[k])}" cy="${Y(ys[k])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${X(xs[k])}" cy="${Y(ys[k])}" r="14" fill="transparent" data-tip="${fmt(new Date(xs[k]),{day:"numeric",month:"short",year:"numeric"})}: ${numFmt(ys[k])} ${F[2]}"/>`).join("")}
  </svg>`;
}

  const tip = $("tip"), c = e.target.closest("[data-tip]");

let chartRange = "m";
function groupOf(line){
  const n = norm(line);
  const g = GROUPS.find(g => g[1].some(w => wordRe(w).test(n)));
  return g ? g[0] : null;
}
function renderChart(){
  const li = L(), weeks = Math.ceil(30/7);
  const ranges = [...Array.from({length:weeks},(_,w)=>[String(w),`${t("week")} ${w+1}`]), ["m",t("month")]];
  $("chartTabs").innerHTML = ranges.map(([v,l])=>`<button class="ghost ${v===chartRange?"on":""}" data-r="${v}">${l}</button>`).join("");
  $("chartTabs").querySelectorAll("button").forEach(b => b.onclick = () => { chartRange = b.dataset.r; renderChart(); });
  const idx = chartRange==="m" ? plan.map((_,k)=>k) : plan.map((_,k)=>k).slice(+chartRange*7, +chartRange*7+7);
  const done = idx.filter(k => state.done[dkey(k)]==="y"), missed = idx.filter(k => state.done[dkey(k)]==="n");
  const use = done.length ? done : idx;
  $("chartStats").innerHTML = `<div class="stat"><b>✓ ${done.length}</b><small>${t("daysDone")}</small></div>
    <div class="stat"><b>✗ ${missed.length}</b><small>${t("daysMissed")}</small></div>
    <div class="stat"><b>${idx.length-done.length-missed.length}</b><small>${t("daysOpen")}</small></div>`;
  $("chartNote").textContent = done.length ? t("doneNote").replace("{n}", done.length) : t("planNote");
  const count = {};
  use.forEach(k => state.meals.forEach(x => { const r = plan[k][x]; if(r!=null) R[x][r][4].forEach(line => { const g = groupOf(line); if(g) count[g]=(count[g]||0)+1; }); }));
  const total = Object.values(count).reduce((a,b)=>a+b,0) || 1;
  const rows = GROUPS.map(g => [g, count[g[0]]||0]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $("chart").setAttribute("aria-label", t("chartAria"));
  $("chart").innerHTML = rows.map(([g,v]) => `<div class="lbl">${g[2][li]}</div>
    <div class="track" data-tip="${g[2][li]}: ${v} ${t("servings")} · ${Math.round(v/total*100)} % ${t("ofTotal")}">
      <div class="bar" style="width:calc((100% - 48px) * ${v/max})"></div>
      <span class="val" style="left:calc((100% - 48px) * ${v/max})">${v}</span></div>`).join("");
}
