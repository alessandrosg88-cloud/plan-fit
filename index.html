<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitDeliMenu · Tu mes de comidas sanas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f7d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitDeliMenu">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f2; --surface:#ffffff; --surface2:#eef1e8; --text:#1d2418; --muted:#5d6655;
  --line:#dde2d4; --accent:#3f7d3a; --accent-soft:#e1efdc; --warn:#b5541f; --warn-soft:#fbe9dd;
  --d:#c98a1a; --l:#3f7d3a; --c:#3a5f8f; --s:#8a4f9c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141811; --surface:#1d2219; --surface2:#262c21; --text:#e8ecdf; --muted:#a1aa95;
    --line:#333b2d; --accent:#8cc97f; --accent-soft:#283a24; --warn:#f0a070; --warn-soft:#3a2619;
    --d:#e3b14e; --l:#8cc97f; --c:#86aee0; --s:#c79ad6; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,5vw,44px);margin:0 0 4px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
h1.logo{margin:0 0 10px;line-height:0}
h1.logo img{height:clamp(120px,22vw,180px);width:auto;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
h2{font-size:18px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--surface2);user-select:none;transition:.15s}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.no input:checked + span{background:var(--warn);border-color:var(--warn)}
.chip.fav input:checked + span{background:var(--d);border-color:var(--d)}
.star{color:var(--d)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.adder{display:flex;gap:8px}.adder input{flex:1;min-width:0}.adder button{flex:none}
#actOpts{gap:6px}#actOpts button{padding:4px 10px;border:1px dashed var(--line);border-radius:999px;font-size:12.5px;font-weight:500;line-height:1.3;background:var(--surface2);color:inherit;cursor:pointer}#actOpts button:hover{border-color:var(--accent)}
.tags{margin-top:10px}.tags:empty{display:none}
.utag{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;font-size:13.5px;color:var(--surface)}
.utag.fav{background:var(--d)}.utag.no{background:var(--warn)}
.utag button{border:none;background:rgba(0,0,0,.18);color:inherit;border-radius:999px;width:22px;height:22px;padding:0;line-height:22px;font-size:13px;cursor:pointer}
.addmsg{font-size:13px;margin:8px 0 0;min-height:0}.addmsg:empty{display:none}.addmsg.err{color:var(--warn)}.addmsg.ok{color:var(--accent)}
input[type=text],input[type=date]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:10px 18px;cursor:pointer}
.primary{background:var(--accent);color:var(--surface)}
.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.07)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.legend b{font-weight:500}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.langs button{padding:5px 10px;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.langs button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.day{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px;cursor:pointer;text-align:left;color:var(--text);font:inherit;font-weight:400;display:flex;flex-direction:column;gap:3px;transition:.15s}
.day:hover{border-color:var(--accent);transform:translateY(-1px)}
.day.empty{background:transparent;border:none;cursor:default;transform:none}
.day .num{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.day .num em{font-style:normal;font-weight:500;color:var(--muted);font-size:11px}
.meal{font-size:11.5px;line-height:1.3;padding-left:7px;border-left:3px solid;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.today{outline:2px solid var(--accent)}
dialog{border:none;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
.dlg-body{padding:6px 20px 20px}
.recipe{padding:14px 0;border-bottom:1px solid var(--line)}
.recipe:last-child{border:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.recipe h4{margin:2px 0 6px;font-size:17px}
.macro{font-size:13px;color:var(--muted)}
.recipe ul{margin:8px 0;padding-left:18px}
.recipe p{margin:6px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--surface)}
.shop{columns:2 240px;gap:24px;padding-left:18px;margin:6px 0 0}
.shop li{break-inside:avoid;margin-bottom:4px}
.shop li span{color:var(--muted);font-size:12.5px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sec-head h2{margin:0 0 4px}
.toggle{flex:none;width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:16px;line-height:1}
.chev{display:inline-block;transition:transform .2s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .sec-body,.card.closed .sec-head .hint{display:none}
.sec-body{margin-top:14px}
.small{padding:7px 14px;font-size:13px}
.day.ok{background:var(--accent-soft);border-color:var(--accent)}
.day.ko{background:var(--warn-soft);border-color:var(--warn)}
.marks{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.mk{flex:1;padding:4px 0;font-size:12px;font-weight:600;border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.mk.y.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mk.n.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.dlg-marks{display:flex;gap:8px;margin:12px 0 4px}
.dlg-marks .mk{flex:none;padding:8px 14px;font-size:13.5px}
.bars{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 12px;align-items:center}
.bars .lbl{font-size:13.5px;color:var(--text);text-align:right}
.bars .track{position:relative;height:22px;cursor:default}
.bars .bar{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.bars .track:hover .bar{filter:brightness(1.12)}
.bars .val{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);padding-left:6px;white-space:nowrap}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow)}
.money{display:flex;align-items:center;gap:8px}
.money input{max-width:140px}
.money span{color:var(--muted);font-size:13.5px;white-space:nowrap}
.money b{font-weight:500}
.budget-bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.budget-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.budget-bar.over i{background:var(--warn)}
.okmsg{color:var(--accent);font-weight:600}
.overmsg{color:var(--warn);font-weight:600}
.shop-total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;margin-top:6px}
.cost{color:var(--muted);font-size:12.5px}
/* --- novedades --- */
input[type=number],select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.people input{max-width:90px}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:13px}
.calc{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px}
.calc .f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.calc input,.calc select{width:100%;min-width:0}
.calc .res{font-size:13.5px;margin:0}
.swapbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.swapbar a{font-size:13px;color:var(--accent);font-weight:600}
.swaplist{display:grid;gap:6px;margin:10px 0;max-height:280px;overflow:auto;padding:2px}
.swaplist button{text-align:left;font-weight:500;background:var(--surface2);color:var(--text);border:1px solid var(--line);padding:8px 12px}
.swaplist button small{color:var(--muted);font-weight:400}
.swaplist button:hover{border-color:var(--accent)}
.swtag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.mbar{display:flex;height:6px;border-radius:999px;overflow:hidden;margin:6px 0 2px;max-width:260px;gap:2px}
.mbar i{display:block;height:100%}
.shop-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.aisles{columns:2 280px;gap:28px;margin-top:14px}
.aisle{break-inside:avoid;margin-bottom:16px}
.aisle h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.slist{list-style:none;margin:0;padding:0}
.slist li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.slist label{flex:1;display:flex;gap:8px;align-items:baseline;cursor:pointer;min-width:0}
.slist input{accent-color:var(--accent);width:17px;height:17px;flex:none;align-self:center}
.slist .amt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.slist .cost{white-space:nowrap}
.slist li.got .nm,.slist li.got .amt{text-decoration:line-through;opacity:.55}
.pbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:13px;line-height:1.2;flex:none}
.pantry{margin-top:6px;padding:12px 14px;background:var(--surface2);border-radius:12px}
.pantry h4{margin:0 0 4px;font-size:14px}
.pantry .chips{margin-top:8px}
.ptag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;font-size:13px;background:var(--surface);border:1px solid var(--line)}
.ptag button{border:none;background:var(--surface2);color:var(--text);border-radius:999px;width:22px;height:22px;padding:0;font-size:12px}
.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.pform label{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.pform input{width:100%;min-width:0}
.pchart{margin-top:10px;position:relative}
.pchart svg{width:100%;height:230px;display:block;overflow:visible}
.pchart .grid line{stroke:var(--line)}
.pchart text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
.ptable{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.ptable th,.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{color:var(--muted);font-weight:600;font-size:12px}
.ptable button{background:none;border:none;color:var(--muted);padding:2px 6px;font-size:13px}
.tablewrap{overflow-x:auto}
.install{display:none}
.install.on{display:inline-block}
.ioshint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
@media (max-width:520px){.calc .f3{grid-template-columns:1fr 1fr}}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.glass{width:34px;height:42px;padding:0;border-radius:6px 6px 10px 10px;border:2px solid var(--c);background:transparent;position:relative;overflow:hidden;font-size:0}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80%;background:var(--c);opacity:.75}
.wbar{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:6px}
.wbar div{flex:1;height:100%;background:var(--surface2);border-radius:4px 4px 0 0;position:relative;min-width:18px}
.wbar div i{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-radius:4px 4px 0 0}
.wlbl{display:flex;gap:4px;font-size:11px;color:var(--muted)}.wlbl span{flex:1;text-align:center;min-width:18px}
.subcard{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.subcard h3{margin:0 0 4px;font-size:15px}
.adapt{margin-top:14px}
.micro{font-size:12.5px;color:var(--muted)}
.bookbar{display:grid;gap:10px}
.bookbar input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.rcard.ban{opacity:.5}
.rcard h4{margin:0;font-size:14.5px;line-height:1.3}
.rcard .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px;align-items:center}
.ibtn{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600}
.ibtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.ibtn.fav.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rform{display:grid;gap:10px}
.rform label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.rform input,.rform select,.rform textarea{width:100%;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.rform textarea{min-height:110px;resize:vertical}
.rform .f4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cook{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:auto}
.cook[hidden]{display:none}
.cook-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.cook-head h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:20px}
.cook-body{flex:1;max-width:760px;width:100%;margin:0 auto;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.cook-step{font-size:clamp(20px,4.6vw,30px);line-height:1.45;font-weight:500}
.cook-n{color:var(--muted);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.cook-nav{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px}
.cook-nav button{flex:1;padding:16px;font-size:17px}
.cook-ing{background:var(--surface2);border-radius:12px;padding:10px 14px}
.cook-ing summary{cursor:pointer;font-weight:600}
.cook-ing label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:16px}
.cook-ing input{width:20px;height:20px;accent-color:var(--accent)}
.cook-ing label:has(input:checked){text-decoration:line-through;opacity:.55}
.tbig{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.tbig.done{color:var(--warn)}
.cook-timer{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
footer{color:var(--muted);font-size:12.5px;margin-top:28px;text-align:center}
.wk-nav{display:none;justify-content:space-between;align-items:center;margin-top:12px;font-weight:600}
.wk-nav button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font:inherit}
.wk-nav button:disabled{opacity:.35;cursor:default}
@media (max-width:760px){
  .cal{grid-template-columns:1fr}
  .dow,.day.empty{display:none}
  .wk-nav{display:flex}
  .day.off{display:none}
  .day{min-height:auto}
  .meal{-webkit-line-clamp:1}
}
@media print{
  #prefs,.row,.tabs,footer,.toggle,.marks,.shop-tools,.pbtn,.pantry,[data-sec=progress],[data-sec=book],.cook,.wk-nav,#langs,.authbar,.install,.ioshint,.cal-tools{display:none!important}
  .day.off{display:flex!important}
  .slist input{display:none}
  .card.closed .sec-body{display:block}
  body{background:#fff}
  .card{box-shadow:none;border:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="langs" id="langs"></div>
  <h1 class="logo"><picture><source srcset="icons/logo-dark.png" media="(prefers-color-scheme: dark)"><img src="icons/logo.png" alt="FitDeliMenu" width="640" height="537"></picture></h1>
  <p data-i="subtitle"></p>
  <div class="row" style="margin-top:12px">
    <button class="ghost small" id="openAll" data-i="openAll"></button>
    <button class="ghost small" id="closeAll" data-i="closeAll"></button>
    <button class="primary small install" id="installBtn" data-i="install"></button>
  </div>
  <p class="ioshint" id="iosHint" hidden></p>
</header>

<section class="card" id="prefs" data-sec="prefs">
  <div class="sec-head"><div><h2 data-i="s1"></h2><p class="hint" data-i="s1hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
  <div class="grid2">
    <fieldset><legend data-i="diet"></legend><div class="chips" id="diet"></div></fieldset>

  return norm(r[0] + " " + r[4].join(" ") + " " + x[0] + " " + x[4].join(" "));
}

function chip(container, type, name, value, label, checked, cls=""){
  const l = document.createElement("label");
  l.className = "chip " + cls;
  l.innerHTML = `<input type="${type}" name="${name}" value="${value}" ${checked?"checked":""}><span>${label}</span>`;
  $(container).appendChild(l);
}

const userWords = s => norm(s||"").split(",").map(w=>w.trim()).filter(Boolean);

function allowed(type, idx){
  const rec = R[type][idx];
  let flags = "", words = [];
  state.diet.forEach(d => flags += (DIETS.find(x=>x[0]===d)||["",""])[1]);
  if(state.diet.includes("vegan")) words.push("miel");
  state.dislikes.forEach(id => { const d = DISLIKES.find(x=>x[0]===id); if(d){ flags += d[1]; words.push(...d[2]); } });
  words.push(...userWords(state.custom));
  if([...rec[1]].some(f => flags.includes(f))) return false;
  if(isBanned(type, idx)) return false;
  if(+state.maxTime > 0 && prepTime(type, idx) > +state.maxTime) return false;
  if(state.diet.includes("lowcarb") && baseCF(type, idx)[0]*4/rec[2] > (type==="l" ? 0.5 : 0.35)) return false;
  if(state.diet.includes("highprot") && rec[3]*4/rec[2] < (type==="s" ? 0.2 : 0.25)) return false;
  const text = searchText(type, idx);
  return !words.some(w => wordRe(w).test(text));
}

function isFav(type, idx){
  const key = type+idx+"|"+state.favs.join()+"|"+state.customFav+"|"+state.lang;
  if(key in favCache) return favCache[key];
  return favCache[key] = rawFav(type, idx);
}
function rawFav(type, idx){
  const words = [];
  state.favs.forEach(id => { const f = FAVS.find(x=>x[0]===id); if(f) words.push(...f[1]); });
  words.push(...userWords(state.customFav));
  const text = searchText(type, idx);
  return words.some(w => wordRe(w).test(text));
}

/* usa algo de la despensa (sin contar básicos como aceite, sal o especias) */
function usesPantry(type, idx){
  const pt = state.pantry || []; if(!pt.length) return false;
  return R[type][idx][4].some(l => { const g = ingOf(l); return g && g[1] !== "desp" && pt.includes(g[0]); });
}
/* cuántas veces entra una receta en cada ronda: favoritos ×3, recetas ♥ ×3, despensa ×2 y según el nivel de proteína */
function weight(type, idx){
  const r = R[type][idx], ratio = r[3]*4 / r[2];
  let w = isFav(type, idx) ? 3 : 1;
  if(isFavR(type, idx)) w *= 3;
  if(usesPantry(type, idx)) w *= 2;
  if(state.protein === "mas") w *= ratio >= 0.3 ? 3 : ratio >= 0.2 ? 2 : 1;
  if(state.protein === "menos") w *= ratio < 0.15 ? 3 : ratio < 0.25 ? 2 : 1;
  return w;
}

function rng(seed){ return () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
function shuffle(arr, rand){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* el plan guarda índices de receta, así cambia de idioma sin cambiar el menú */
let plan = [], pools = {};
function generate(){
  const rand = rng(state.seed * 7919 + 13);
  pools = {}; plan = [];
  const queues = {};
  state.meals.forEach(t => { pools[t] = R[t].map((_,i)=>i).filter(i => allowed(t,i)); queues[t] = []; });
  for(let i=0;i<30;i++){
    const day = {};
    state.meals.forEach(t => {
      if(!pools[t].length){ day[t]=null; return; }
      if(!queues[t].length){
        // los favoritos entran 3 veces en cada ronda, así salen más a menudo
        const weighted = pools[t].flatMap(r => Array(weight(t,r)).fill(r));
        const q = shuffle(weighted, rand);
        for(let k=1;k<q.length;k++) if(q[k]===q[k-1]){ const j=q.findIndex((x,idx)=>idx>k && x!==q[k]); if(j>0) [q[k],q[j]]=[q[j],q[k]]; }
        queues[t] = q;
      }
      let pick = queues[t].shift();
      const prev = plan[i-1] && plan[i-1][t];
      if(prev === pick && queues[t].length){ queues[t].push(pick); pick = queues[t].shift(); }
      day[t] = pick;
    });
    plan.push(day);
  }
  fitBudget();
  /* cocinar por tandas: la comida y la cena de los días pares se repiten al día siguiente */
  if(state.batch === "double"){
    for(let i=1;i<plan.length;i+=2) ["l","c"].forEach(x => { if(state.meals.includes(x)) plan[i][x] = plan[i-1][x]; });
    if(parseFloat(state.budget) > 0) overWeeks = Array.from({length:Math.ceil(30/7)},(_,w)=>w).filter(w => weekCost(w) > budgetFor(w) + 0.01);
  }
  /* platos cambiados a mano: mandan sobre el generador */
  let sw = false;
  plan.forEach((day,i) => state.meals.forEach(x => { const s = (state.swaps||{})[dkey(i)+"|"+x]; if(s != null && pools[x].includes(s) && day[x] !== s){ day[x] = s; sw = true; } }));
  if(sw && parseFloat(state.budget) > 0) overWeeks = Array.from({length:Math.ceil(30/7)},(_,w)=>w).filter(w => weekCost(w) > budgetFor(w) + 0.01);
}
const batchRole = (i, x) => state.batch !== "double" || !["l","c"].includes(x) ? null : i % 2 ? "left" : (i+1 < plan.length ? "cook" : null);
const isSwapped = (i, x) => { const s = (state.swaps||{})[dkey(i)+"|"+x]; return s != null && plan[i] && plan[i][x] === s; };

const weekDays = w => plan.map((_,k)=>k).slice(w*7, w*7+7);
const dayCost = day => state.meals.reduce((a,x)=>a+(day[x]!=null?cost(x,day[x]):0),0);
const weekCost = w => weekDays(w).reduce((a,k)=>a+dayCost(plan[k]),0);
const budgetFor = w => parseFloat(state.budget) * weekDays(w).length / 7;
let overWeeks = [];
/* cambia las comidas más caras por alternativas más baratas hasta que cada semana entra en el presupuesto */
function fitBudget(){
  overWeeks = [];
  const b = parseFloat(state.budget);
  if(!(b > 0)) return;
  for(let w=0; w<Math.ceil(30/7); w++){
    let guard = 0;
    while(weekCost(w) > budgetFor(w) && guard++ < 200){
      let best = null;
      weekDays(w).forEach(k => state.meals.forEach(x => {
        const cur = plan[k][x]; if(cur==null) return;
        const cc = cost(x,cur);
        const prev = plan[k-1] && plan[k-1][x], next = plan[k+1] && plan[k+1][x];
        const used = new Set(weekDays(w).map(j => plan[j][x]));
        const cands = pools[x].filter(r => r!==prev && r!==next && cost(x,r) < cc - 0.05);
        if(!cands.length) return;
        // preferir alternativas no repetidas en la semana y favoritas
        cands.sort((a,c) => (used.has(a)-used.has(c)) || (isFav(x,c)-isFav(x,a)) || (cost(x,c)-cost(x,a)));
        const alt = cands[0], saving = cc - cost(x,alt);
        if(!best || saving > best.saving) best = {k, x, alt, saving};
      }));
      if(!best) break;
      plan[best.k][best.x] = best.alt;
    }
    if(weekCost(w) > budgetFor(w) + 0.01) overWeeks.push(w);
  }
}

/* añadir alimentos propios (favoritos / evitar) con botón y aviso de duplicados */
const TAGS = {customFav:{key:"customFav", other:"custom", list:FAVS, lbl:2, kw:1, name:"fav", cls:"fav", conflict:"addConflictFav"},
              custom:{key:"custom", other:"customFav", list:DISLIKES, lbl:3, kw:2, name:"dis", cls:"no", conflict:"addConflictNo"}};

function renderTags(){
  Object.values(TAGS).forEach(c => {
    $(c.key).value = state[c.key] || "";
    $(c.key+"Tags").innerHTML = tagList(c.key).map((w,i) => `<span class="utag ${c.cls}">${w.replace(/[&<>"]/g,"")}<button type="button" data-k="${c.key}" data-n="${i}" aria-label="${t("removeLbl")} ${w.replace(/[&<>"]/g,"")}">✕</button></span>`).join("");

function presetMatch(c, n){
  return c.list.find(it => it[c.lbl].concat([it[0]]).some(l => norm(l).split("/").map(x=>x.trim()).includes(n)) || (it[c.kw]||[]).includes(n));
}
function addTag(k){
  const c = TAGS[k], inp = $(k+"In"), msg = $(k+"Msg"), raw = inp.value.trim();
  const say = (key, w, ok) => { msg.textContent = t(key).replace("{w}", w); msg.className = "addmsg " + (ok ? "ok" : "err"); };
  if(!raw) return;
  readForm();
  const words = raw.split(",").map(w => w.trim()).filter(Boolean);
  let changed = false;
  for(const w of words){
    const n = norm(w), o = TAGS[c.other];
    const preset = presetMatch(c, n), checked = preset && document.querySelector(`input[name=${c.name}][value="${preset[0]}"]`);
    if(tagList(k).includes(n) || (checked && checked.checked)){ say("addDup", w); continue; }
    const oPreset = presetMatch(o, n), oChecked = oPreset && document.querySelector(`input[name=${o.name}][value="${oPreset[0]}"]`);
    if(tagList(o.key).includes(n) || (oChecked && oChecked.checked)){ say(c.conflict, w); continue; }
    if(checked){ checked.checked = true; say("addMarked", w, true); changed = true; continue; }
    state[k] = tagList(k).concat(n).join(", "); say("addOk", w, true); changed = true;
  }
  inp.value = "";
  if(changed){ $(k).value = state[k]; renderTags(); run(); }
}

const star = (type, idx) => isFav(type, idx) ? '<span class="star">★</span> ' : '';

let calWeek = null;
function renderCalendar(){
  const cal = $("cal"); cal.innerHTML = "";
  UI.dow[L()].forEach(d => cal.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const offset = (dayDate(0).getDay()+6)%7;
  for(let i=0;i<offset;i++) cal.insertAdjacentHTML("beforeend",`<div class="day empty" data-wk="0"></div>`);
  const todayStr = new Date().toDateString();
  if(calWeek === null){
    const ti = plan.findIndex((_,i) => dayDate(i).toDateString()===todayStr);
    calWeek = ti >= 0 ? Math.floor((offset+ti)/7) : 0;
  }
  plan.forEach((day,i) => {
    const d = dayDate(i);
    const st = state.done[dkey(i)];
    const b = document.createElement("div");
    b.className = "day" + (d.toDateString()===todayStr ? " today":"") + (st==="y"?" ok":st==="n"?" ko":"");
    b.dataset.wk = Math.floor((offset+i)/7);
    b.tabIndex = 0; b.setAttribute("role","button");
    b.innerHTML = `<div class="num">${fmt(d,{weekday:"short",day:"numeric",month:"short"})}<em>${t("day")} ${i+1}</em></div>` +
      state.meals.map(x => day[x]!=null ? `<div class="meal" style="border-color:${COLORS[x]}">${batchRole(i,x)==="left" ? "🍱 " : ""}${star(x,day[x])}${tr(x,day[x])[0]}</div>` : "").join("") +
      marksHTML(i);
    b.onclick = e => { const m = e.target.closest(".mk"); if(m){ e.stopPropagation(); mark(i, m.dataset.v); } else openDay(i); };
    b.onkeydown = e => { if((e.key==="Enter"||e.key===" ") && e.target===b){ e.preventDefault(); openDay(i); } };
    cal.appendChild(b);
  });
  showWeek();
}
function showWeek(){
  const days = [...$("cal").querySelectorAll(".day")];
  const total = Math.max(...days.map(d => +d.dataset.wk)) + 1;
  calWeek = Math.min(Math.max(calWeek,0), total-1);
  days.forEach(d => d.classList.toggle("off", +d.dataset.wk !== calWeek));
  $("wkLbl").textContent = `${t("week")} ${calWeek+1} / ${total}`;
  $("wkPrev").disabled = calWeek === 0;
  $("wkNext").disabled = calWeek === total-1;
}
$("wkPrev").onclick = () => { calWeek--; showWeek(); };
$("wkNext").onclick = () => { calWeek++; showWeek(); };

const pad = n => String(n).padStart(2,"0");
const dkey = i => { const d = dayDate(i); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function marksHTML(i){
  const st = state.done[dkey(i)];
  return `<div class="marks"><button class="mk y ${st==="y"?"on":""}" data-v="y" title="${t("doneLbl")}" aria-pressed="${st==="y"}">✓</button><button class="mk n ${st==="n"?"on":""}" data-v="n" title="${t("missedLbl")}" aria-pressed="${st==="n"}">✗</button></div>`;

  const k = dkey(i);
  if(state.done[k] === v) delete state.done[k]; else state.done[k] = v;
  save(); renderCalendar(); renderSummary(); renderChart();
  if($("dlg").open && openIdx===i) openDay(i);
}

const FRAC = {0.25:"¼",0.5:"½",0.75:"¾"};
function fmtCount(v){ const q = Math.round(v*4)/4, w = Math.floor(q), f = q - w; return (w || !f ? String(w) : "") + (FRAC[f] || ""); }
/* cantidades de la receta: gramos según objetivo (y proteína) y nº de personas; unidades según personas */
function scaleQty(line, m, isP, n=1){
  if(isP) m *= pFactor();
  const gm = m*n, um = isP ? m*n : n;
  if(/^\d+(?:[.,]\d+)?\s*(g|ml)\b/.test(line))
    return gm===1 ? line : line.replace(/^(\d+(?:[.,]\d+)?)/, x => Math.round(parseFloat(x.replace(",","."))*gm/5)*5);
  const q = line.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?)(?=\s)/);
  if(!q || um===1) return line;
  const v = parseNum(q[1])*um;
  return (isP ? String(Math.max(1, Math.round(v))) : fmtCount(v)) + line.slice(q[1].length);
}

let openIdx = null, swapOpen = null;
const MEAL_TIME = {d:[8,0],l:[14,0],s:[17,30],c:[21,0]};
const ymdC = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
function gcalLink(i, x){
  const r = tr(x, plan[i][x]), d = dayDate(i), [h,mi] = MEAL_TIME[x], end = new Date(d); end.setHours(h, mi+30);
  const st = `${ymdC(d)}T${pad(h)}${pad(mi)}00`, en = `${ymdC(end)}T${pad(end.getHours())}${pad(end.getMinutes())}00`;
  const det = r[4].join("\n") + "\n\n" + r[5];
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(`${TYPES[x][L()]}: ${r[0]}`) + `&dates=${st}/${en}&details=` + encodeURIComponent(det);

const macroBar = (mc) => { const e = [mc[1]*4, mc[2]*4, mc[3]*9], tot = e.reduce((a,b)=>a+b,0) || 1;

function shopItems(w){
  const items = {}, m = mult(), f = pFactor(), cf = cFactor(), n = ppl(), li = L();
  weekDays(w).forEach(k => state.meals.forEach(x => {
    const r = plan[k][x]; if(r == null) return;
    const es = R[x][r][4], loc = tr(x, r)[4];
    es.forEach((line, j) => {
      const ing = ingOf(line), isP = isProtIng(line);
      let id, name, aisle;
      if(ing){ id = ing[0]; name = ing[6][li]; aisle = ing[1]; }
      else { const nm = (loc[j]||line).replace(UNIT,"").trim(); name = nm.charAt(0).toUpperCase()+nm.slice(1); id = "x:"+norm(name); aisle = "otros"; }
      const it = items[id] || (items[id] = {id, name, aisle, amt:{}, n:0, cost:0});
      it.n++;

      const am = lineAmt(line, ing);

/* calculadora de calorías (Mifflin-St Jeor) */
const ACT = [1.2, 1.375, 1.55, 1.725, 1.9];
const GOAL_ADJ = {perder:0.8, mantener:1, ganar:1.1};
function calcKcal(){
  const p = state.profile || {}, a = +p.age, h = +p.h, w = +p.w;
  if(!(a > 0 && h > 0 && w > 0)) return null;
  const bmr = 10*w + 6.25*h - 5*a + (p.sex === "m" ? 5 : -161);
  const tdee = bmr * (ACT[p.act ?? 1] || 1.375);
  const goal = (document.querySelector('input[name=goal]:checked')||{}).value || state.goal;
  const k = Math.max(p.sex === "m" ? 1500 : 1200, Math.round(tdee * (GOAL_ADJ[goal]||1) / 50) * 50);
  return {b: Math.round(bmr), t: Math.round(tdee), k};
}
function readCalc(){
  state.profile = {sex: (document.querySelector('input[name=sex]:checked')||{}).value || "f", age: $("cAge").value, h: $("cH").value, w: $("cW").value, act: +$("cAct").value, actTxt: $("cActTxt").value};
}
/* deduce el nivel a partir de lo que escribe el usuario */
function guessAct(txt){
  const parts = (txt||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[,;+\n]|\by\b|\band\b|\ben\b|\be\b/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const NUM = {uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,twee:2,drie:3,vier:4,vijf:5,zes:6,zeven:7};
  const WALK = /(camin|andar|pasear|walk|wandel|cammin|passeggi)/, SPORT = /(gym|gimnas|correr|running|run\b|futbol|football|soccer|voetbal|calcio|crossfit|nadar|swim|zwem|nuot|bici|cycl|fiets|pesas|weights|yoga|pilates|padel|tenis|tennis|balonc|basket|sport|deporte|palestra|corsa|hardlop|fitness|entren|training|train|allenam|boxeo|boxing|artes marciales|baile|dance|danza|escalada|climb)/;
  let best = null;
  for(const s of parts){
    let lv = null;
    if(/(obra|construcc|albanil|mudanza|almacen|campo|reparto|camarer|fisico|physical|construction|warehouse|bouw|magazijn|fysiek|edilizia|magazzino|fisico)/.test(s)) lv = 4;
    else if(/((2|dos|two|due|twee) (veces|sesiones|entrenos|times|sessions|volte|keer)( al| por| cada| a| per)? (dia|day|giorno|dag))|twice a day|2x/.test(s)) lv = 4;
    else {
      const n = +((s.match(/\b([1-7])\b/)||[])[1] || NUM[(s.match(/\b(uno|una|dos|tres|cuatro|cinco|seis|siete|one|two|three|four|five|six|seven|due|tre|quattro|cinque|sei|sette|twee|drie|vier|vijf|zes|zeven)\b/)||[])[1]] || 0);
      const daily = /(diario|todos los dias|cada dia|al dia|every day|daily|a day|ogni giorno|al giorno|elke dag|per dag|dagelijks)/.test(s);
      if(WALK.test(s) && !SPORT.test(s)) lv = 1;
      else if(SPORT.test(s) || n) lv = n ? (n >= 6 ? 3 : n >= 4 ? 2 : 1) : daily ? 3 : 2;
      else if(/(nada|ninguna|sedentari|oficina|sentad|none|nothing|office|desk|geen|kantoor|niente|ufficio)/.test(s)) lv = 0;
    }
    if(lv !== null) best = Math.max(best ?? 0, lv);
  }
  return best;
}

/* método de la Marina de EE. UU. */
function bodyFat(e){
  const p = state.profile || {}, h = +p.h;
  if(!(h > 0) || !(e.waist > 0) || !(e.neck > 0)) return null;
  let v;
  if(p.sex === "m"){ if(e.waist <= e.neck) return null; v = 495/(1.0324 - 0.19077*Math.log10(e.waist - e.neck) + 0.15456*Math.log10(h)) - 450; }
  else { if(!(e.hip > 0) || e.waist + e.hip <= e.neck) return null; v = 495/(1.29579 - 0.35004*Math.log10(e.waist + e.hip - e.neck) + 0.22100*Math.log10(h)) - 450; }
  return v > 2 && v < 65 ? Math.round(v*10)/10 : null;
}

/* ajuste de calorías según la tendencia de peso (últimas 5 semanas) */
let adaptK = null;
function renderAdapt(list){
  const box = $("adapt"), cut = Date.now() - 35*864e5;
  const pts = list.filter(e => e.w && new Date(e.d+"T12:00:00").getTime() >= cut);
  const span = pts.length > 1 ? (new Date(pts[pts.length-1].d) - new Date(pts[0].d))/864e5 : 0;
  adaptK = null;
  if(pts.length < 2 || span < 10){ box.innerHTML = `<h3>${t("adaptTitle")}</h3><p class="hint" style="margin:0">${t("adaptNeed")}</p>`; return; }
  const xs = pts.map(e => new Date(e.d+"T12:00:00").getTime()/864e5/7), ys = pts.map(e => e.w);
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  const slope = xs.reduce((a,x,k)=>a+(x-mx)*(ys[k]-my),0) / (xs.reduce((a,x)=>a+(x-mx)**2,0) || 1);
  const pct = slope / ys[ys.length-1] * 100;
  const cur = kcalTarget() || Math.round(plan.reduce((a,d)=>a+sumDay(d,2),0)/30*mult());
  const goal = state.goal, r50 = v => Math.round(v/50)*50;
  let msg = "adaptOk", delta = 0;
  if(goal === "perder"){ if(pct > -0.25){ msg = "adaptSlowLose"; delta = -150; } else if(pct < -1){ msg = "adaptFastLose"; delta = 150; } }
  else if(goal === "ganar"){ if(pct < 0.1){ msg = "adaptSlowGain"; delta = 150; } else if(pct > 0.5){ msg = "adaptFastGain"; delta = -150; } }
  else if(Math.abs(pct) > 0.25){ msg = "adaptDrift"; delta = pct > 0 ? -150 : 150; }
  const minK = (state.profile||{}).sex === "m" ? 1500 : 1200;
  if(delta) adaptK = Math.max(minK, r50(cur + delta));
  if(adaptK === cur) adaptK = null;
  box.innerHTML = `<h3>${t("adaptTitle")}</h3><p style="margin:0 0 6px;font-size:14px">${t("adaptRate").replace("{r}", (slope>0?"+":slope<0?"−":"") + numFmt(Math.abs(slope),2) + " kg").replace("{p}", (pct>0?"+":pct<0?"−":"") + numFmt(Math.abs(pct),2))}</p>
    <p style="margin:0;font-size:14px" class="${delta ? "" : "okmsg"}">${t(msg).replace("{k}", adaptK || cur)}</p>
    ${adaptK ? `<div style="margin-top:10px"><button type="button" class="primary small" id="adaptApply">${t("adaptApply").replace("{k}", adaptK)}</button></div>` : ""}`;
}

function progressSVG(pts, F, label){
  const W = Math.max(280, Math.round($("pChart").clientWidth || 640)), H = 230, ml = 44, mr = 14, mt = 14, mb = 28, key = F[0];
  const xs = pts.map(e => new Date(e.d+"T12:00:00").getTime()), ys = pts.map(e => e[key]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const padY = Math.max(0.5, (hi-lo)*0.15); lo -= padY; hi += padY;
  const x0 = Math.min(...xs), x1 = Math.max(...xs), X = v => ml + (x1===x0 ? 0.5 : (v-x0)/(x1-x0)) * (W-ml-mr), Y = v => mt + (1-(v-lo)/(hi-lo)) * (H-mt-mb);
  const ticks = Array.from({length:4},(_,k) => lo + (hi-lo)*(k+0.5)/4);
  const xl = [0, Math.floor((pts.length-1)/2), pts.length-1].filter((v,k,a) => a.indexOf(v)===k);
  const path = pts.map((e,k) => (k?"L":"M") + X(xs[k]).toFixed(1) + " " + Y(ys[k]).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("pChartAria")} ${label}">
    <g class="grid">${ticks.map(v => `<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${numFmt(v)}</text>`).join("")}</g>
    ${xl.map(k => `<text x="${X(xs[k])}" y="${H-8}" text-anchor="${k===0?"start":k===pts.length-1?"end":"middle"}">${fmt(new Date(xs[k]),{day:"numeric",month:"short"})}</text>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((e,k) => `<circle cx="${X(xs[k])}" cy="${Y(ys[k])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${X(xs[k])}" cy="${Y(ys[k])}" r="14" fill="transparent" data-tip="${fmt(new Date(xs[k]),{day:"numeric",month:"short",year:"numeric"})}: ${numFmt(ys[k])} ${F[2]}"/>`).join("")}
  </svg>`;
}

function renderBook(){

  $("bCount").textContent = `${items.length} ${t("results")}`;
  $("bGrid").innerHTML = items.slice(0, bLimit).map(([x,i]) => { const mc = macros(x,i), m = mult(), fv = isFavR(x,i), bn = isBanned(x,i);
    return `<div class="rcard ${bn?"ban":""}"><span class="tag" style="color:${COLORS[x]}">${TYPES[x][li]}${isUser(x,i) ? ` · ${t("myRecipe")}` : ""}${bn ? ` · ${t("banned")}` : ""}</span>
      <h4>${star(x,i)}${escH(tr(x,i)[0])}</h4><div class="micro">${Math.round(mc[0]*m)} kcal · ${Math.round(mc[1]*m)} g ${t("protein")} · ${timeTxt(x,i)}</div>
      <div class="acts"><button type="button" class="ibtn" data-v="${x}:${i}">${t("view")}</button><button type="button" class="ibtn fav ${fv?"on":""}" data-f="${x}:${i}" aria-pressed="${fv}" title="${t("favR")}" aria-label="${t("favR")}">♥</button><button type="button" class="ibtn ${bn?"on":""}" data-b="${x}:${i}" aria-pressed="${bn}" title="${t("banR")}" aria-label="${t("banR")}">🚫</button></div></div>`; }).join("");
  $("bMore").hidden = items.length <= bLimit;
}
function toggleList(key, x, i){ const k = rkey(x,i), l = state[key] || []; state[key] = l.includes(k) ? l.filter(v => v !== k) : l.concat(k); }
$("bSearch").addEventListener("input", e => { bQuery = e.target.value; bLimit = 30; renderBook(); });
$("bTypes").addEventListener("change", e => { bType = e.target.value; bLimit = 30; renderBook(); });
$("bFilters").addEventListener("change", e => { const v = e.target.value, c = e.target.checked; if(v==="ok") bOnlyOk = c; if(v==="fav") bOnlyFav = c; if(v==="ban") bShowBan = c; bLimit = 30; renderBook(); });
$("bMore").onclick = () => { bLimit += 30; renderBook(); };
$("bAdd").onclick = () => openRecipeForm(null);
$("bGrid").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const [x, i] = (b.dataset.v || b.dataset.f || b.dataset.b || ":").split(":"), n = +i;
  if(b.dataset.v){ bMsg = ""; openRecipe(x, n); }
  else if(b.dataset.f){ toggleList("favRecipes", x, n); save(); run(); }
  else if(b.dataset.b){ toggleList("banned", x, n); save(); run(); }
});
/* ver una receta suelta */
function openRecipe(x, i){
  openIdx = null; viewing = [x, i];
  const r = tr(x, i), mc = macros(x, i), m = mult(), n = ppl(), es = R[x][i][4], li = L();
  const canPlan = state.meals.includes(x) && allowed(x, i);
  $("dlgTitle").textContent = r[0];
  $("dlgBody").innerHTML = `<div class="recipe"><span class="tag" style="color:${COLORS[x]}">${TYPES[x][li]}${isUser(x,i) ? ` · ${t("myRecipe")}` : ""}</span>
    <div class="macro" style="margin-top:6px">${macroTxt(mc, m)} · ≈ ${money(cost(x,i))} · ${timeTxt(x,i)}</div>${macroBar(mc)}
    <div class="micro">${microTxt(microOf(x,i), m)}</div>${n>1 ? `<p class="macro">${t("forPeople").replace("{n}",n)}</p>` : ""}
    <ul>${r[4].map((y,k)=>`<li>${escH(scaleQty(y,m,isProtIng(es[k]),n))}</li>`).join("")}</ul><p>${escH(r[5])}</p>
    <div class="swapbar"><button type="button" class="primary small" data-cookr="1">${t("cookMode")}</button>
      <button type="button" class="ibtn fav ${isFavR(x,i)?"on":""}" data-favr="1">♥ ${t("favR")}</button>
      <button type="button" class="ibtn ${isBanned(x,i)?"on":""}" data-banr="1">🚫 ${t("banR")}</button>
      ${isUser(x,i) ? `<button type="button" class="ghost small" data-editr="1">${t("editMine")}</button><button type="button" class="ghost small" data-delr="1">${t("delMine")}</button>` : ""}</div>
    ${canPlan ? `<div class="swapbar" style="margin-top:12px"><label class="macro" for="planDay">${t("addToPlan")}</label><select id="planDay">${plan.map((_,k) => `<option value="${k}" ${k===planDaySel?"selected":""}>${t("day")} ${k+1} · ${fmt(dayDate(k),{weekday:"short",day:"numeric",month:"short"})}</option>`).join("")}</select><button type="button" class="ghost small" data-planr="1">OK</button></div>`
      : `<p class="hint" style="margin-top:12px">${t("notCompat")}</p>`}
    ${bMsg ? `<p class="addmsg ok">${bMsg}</p>` : ""}</div>`;
  if(!$("dlg").open) $("dlg").showModal();
}
/* formulario de receta propia */
const FLAGS = "glenmcpfs";
function openRecipeForm(id){
  openIdx = null; viewing = null;
  const m = (state.myRecipes||[]).find(x => x.id === id) || {t:"l", flags:"", ing:[]}, li = L();
  $("dlgTitle").textContent = id ? t("editMine").replace(/^\S+\s/,"") : t("addMine").replace(/^\+\s*/,"");
  $("dlgBody").innerHTML = `<form class="rform" id="rForm" data-id="${id||""}" style="padding-top:12px">
    <label>${t("rName")}<input name="name" required maxlength="80" value="${escH(m.name||"")}"></label>
    <div class="f4"><label>${t("rType")}<select name="t">${MEALS.map(x => `<option value="${x}" ${m.t===x?"selected":""}>${TYPES[x][li]}</option>`).join("")}</select></label>
      <label>${t("rKcal")}<input name="kcal" type="number" min="20" max="2500" required value="${m.kcal||""}"></label>
      <label>${t("rProt")}<input name="rprot" type="number" min="0" max="200" required value="${m.prot ?? ""}"></label>
      <label>${t("rTime")}<input name="time" type="number" min="1" max="600" value="${m.time||""}"></label></div>
    <label>${t("rIng")}<textarea name="ing" required>${escH((m.ing||[]).join("\n"))}</textarea></label>
    <p class="hint" style="margin:-4px 0 0">${t("rIngTip")}</p>
    <label>${t("rSteps")}<textarea name="steps">${escH(m.steps||"")}</textarea></label>
    <fieldset><legend style="font-size:12.5px;color:var(--muted)">${t("rFlags")}</legend><div class="chips">${[...FLAGS].map((f,k) => `<label class="chip"><input type="checkbox" name="fl" value="${f}" ${(m.flags||"").includes(f)?"checked":""}><span>${UI.flagNames[li][k]}</span></label>`).join("")}</div></fieldset>
    <p class="addmsg err" id="rMsg"></p>
    <div><button class="primary">${t("rSave")}</button></div></form>`;
  if(!$("dlg").open) $("dlg").showModal();
}
$("dlgBody").addEventListener("submit", e => {
  if(e.target.id !== "rForm") return;
  e.preventDefault();
  const f = e.target, v = k => f.elements[k].value.trim();
  const ing = v("ing").split("\n").map(x => x.trim()).filter(Boolean);
  if(!v("name") || !(+v("kcal") > 0) || v("rprot") === "" || !ing.length){ $("rMsg").textContent = t("rReq"); return; }
  const id = f.dataset.id || Date.now().toString(36);
  const rec = {id, t: v("t"), name: v("name"), kcal: Math.round(+v("kcal")), prot: Math.round(+v("rprot")), time: Math.round(+v("time")) || 0, ing, steps: v("steps"),
    flags: [...f.querySelectorAll("input[name=fl]:checked")].map(x => x.value).join("")};
  const old = (state.myRecipes||[]).find(x => x.id === id);
  if(old && old.t !== rec.t) clearTypeRefs(old.t);
  state.myRecipes = old ? state.myRecipes.map(x => x.id === id ? rec : x) : (state.myRecipes||[]).concat(rec);
  save(); run();
  const idx = Object.entries(USER_ID[rec.t]).find(([,u]) => u === id);
  bMsg = ""; if(idx) openRecipe(rec.t, +idx[0]);
});
/* al borrar o mover una receta propia cambian los índices: se quitan los cambios a mano de ese tipo */
function clearTypeRefs(x){ const sw = {...(state.swaps||{})}; Object.keys(sw).forEach(k => { if(k.endsWith("|"+x)) delete sw[k]; }); state.swaps = sw; }
$("dlgBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || !viewing) return;
  const [x, i] = viewing, d = b.dataset;
  if(d.cookr) openCook(x, i);
  else if(d.favr){ toggleList("favRecipes", x, i); save(); run(); openRecipe(x, i); }
  else if(d.banr){ toggleList("banned", x, i); save(); run(); openRecipe(x, i); }
  else if(d.editr) openRecipeForm(USER_ID[x][i]);
  else if(d.delr){
    const id = USER_ID[x][i], nm = tr(x,i)[0];
    if(!confirm(t("delConfirm").replace("{n}", nm))) return;
    const k = "u"+id;
    state.myRecipes = state.myRecipes.filter(r => r.id !== id);
    state.favRecipes = (state.favRecipes||[]).filter(v => v !== k); state.banned = (state.banned||[]).filter(v => v !== k);
    clearTypeRefs(x); viewing = null; save(); run(); $("dlg").close();
  }
  else if(d.planr){
    const day = planDaySel = +$("planDay").value;
    setSwap(day, x, i);
    bMsg = t("added").replace("{n}", tr(x,i)[0]).replace("{d}", day+1);
    openRecipe(x, i);
  }
});
$("dlg").addEventListener("close", () => { viewing = null; bMsg = ""; });

/* ---- modo cocina: pasos uno a uno, temporizador y pantalla encendida ---- */
let cook = null, wakeLock = null, timerId = null, timerEnd = 0;
async function keepAwake(){ try { if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", () => { if(cook && document.visibilityState === "visible") keepAwake(); });
function openCook(x, i){
  const r = tr(x, i), es = R[x][i][4], m = mult(), n = ppl();
  const steps = String(r[5]).split(/(?<=[.!?])\s+(?=\S)/).map(v => v.trim()).filter(Boolean);
  cook = {x, i, step: 0, steps: steps.length ? steps : [r[5]], ing: r[4].map((y,k) => scaleQty(y, m, isProtIng(es[k]), n)), name: r[0]};
  if($("dlg").open) $("dlg").close();
  $("cook").hidden = false; document.body.style.overflow = "hidden";
  keepAwake(); renderCook();
}
function renderCook(){
  const c = cook, last = c.step === c.steps.length - 1, st = c.steps[c.step];
  const tm = st.match(/(\d+)(?:\s*-\s*(\d+))?\s*min/i);
  $("cookTitle").textContent = c.name;
  $("cookBody").innerHTML = `<details class="cook-ing" ${c.step===0?"open":""}><summary>${t("ingredients")} (${c.ing.length})</summary>${c.ing.map((y,k) => `<label><input type="checkbox" ${c.got && c.got[k] ? "checked" : ""} data-k="${k}">${escH(y)}</label>`).join("")}</details>
    <div class="cook-n">${t("step")} ${c.step+1} / ${c.steps.length}</div>
    <div class="cook-step">${escH(st)}</div>
    <div class="cook-timer" id="cookTimer">${tm ? `<button type="button" class="ghost" data-timer="${+(tm[2]||tm[1])}">${t("timer").replace("{n}", +(tm[2]||tm[1]))}</button>` : ""}</div>
    <p class="hint" style="margin:0">${t("awake")}</p>
    <div class="cook-nav"><button type="button" class="ghost" data-nav="-1" ${c.step===0?"disabled":""}>${t("prev")}</button><button type="button" class="primary" data-nav="${last ? "end" : "1"}">${last ? t("finish") : t("next")}</button></div>`;
  if(timerId) drawTimer();
}
function drawTimer(){
  const left = Math.max(0, Math.round((timerEnd - Date.now())/1000)), el = $("cookTimer"); if(!el) return;
  el.innerHTML = `<div class="tbig ${left?"":"done"}">${left ? `${Math.floor(left/60)}:${pad(left%60)}` : t("timerDone")}</div><button type="button" class="ghost small" data-stop="1">${t("stop")}</button>`;
}
function beep(){
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.35, 0.7].forEach(s0 => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(0.25, ac.currentTime+s0); o.start(ac.currentTime+s0); o.stop(ac.currentTime+s0+0.22); }); } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300,150,300]); } catch(e){}
}
function closeCook(){
  clearInterval(timerId); timerId = null; cook = null;
  $("cook").hidden = true; document.body.style.overflow = "";
  try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null;
}
$("cookClose").onclick = closeCook;
document.addEventListener("keydown", e => { if(!cook) return; if(e.key === "Escape") closeCook(); if(e.key === "ArrowRight" && cook.step < cook.steps.length-1){ cook.step++; renderCook(); } if(e.key === "ArrowLeft" && cook.step > 0){ cook.step--; renderCook(); } });
$("cookBody").addEventListener("change", e => { const k = e.target.dataset.k; if(k != null){ cook.got = cook.got || {}; cook.got[k] = e.target.checked; } });
$("cookBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || !cook) return;
  if(b.dataset.nav === "end") return closeCook();
  if(b.dataset.nav){ cook.step = Math.min(cook.steps.length-1, Math.max(0, cook.step + +b.dataset.nav)); renderCook(); }
  if(b.dataset.timer){
    clearInterval(timerId); timerEnd = Date.now() + +b.dataset.timer*60000; let rang = false;
    timerId = setInterval(() => { drawTimer(); if(!rang && Date.now() >= timerEnd){ rang = true; beep(); } }, 500); drawTimer();
  }
  if(b.dataset.stop){ clearInterval(timerId); timerId = null; renderCook(); }
});

/* ---- despensa: añadir a mano ---- */
function findIngr(w){
  const n = norm(w).trim(); if(!n || typeof INGR === "undefined") return null;
  return INGR.find(g => g[6].some(l => norm(l) === n)) || INGR.find(g => g[2].some(k => wordRe(k).test(n) || wordRe(n).test(k))) || INGR.find(g => g[6].some(l => norm(l).includes(n)));
}
$("pantry").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("pantryIn"), msg = $("pantryMsg"), words = inp.value.split(",").map(w => w.trim()).filter(Boolean);
  const bad = [];
  words.forEach(w => { const g = findIngr(w); if(!g) bad.push(w); else if(!state.pantry.includes(g[0])) state.pantry = state.pantry.concat(g[0]); });
  inp.value = "";
  save(); run();
  if(bad.length){ $("pantryMsg").textContent = t("pantryUnknown").replace("{w}", bad.join(", ")); $("pantryMsg").className = "addmsg err"; }
});

run();

/* ---- app instalable (PWA) ---- */
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").classList.add("on"); });
window.addEventListener("appinstalled", () => { installEvt = null; $("installBtn").classList.remove("on"); });
$("installBtn").onclick = async () => { if(!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; $("installBtn").classList.remove("on"); };
(function(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone;
  if(ios){ $("iosHint").hidden = false; $("iosHint").textContent = t("iosInstall"); }
})();
</script>
