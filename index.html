<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Fit 30 días</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f2; --surface:#ffffff; --surface2:#eef1e8; --text:#1d2418; --muted:#5d6655;
  --line:#dde2d4; --accent:#3f7d3a; --accent-soft:#e1efdc; --warn:#b5541f; --warn-soft:#fbe9dd;
  --d:#c98a1a; --l:#3f7d3a; --c:#3a5f8f; --s:#8a4f9c;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141811; --surface:#1d2219; --surface2:#262c21; --text:#e8ecdf; --muted:#a1aa95;
    --line:#333b2d; --accent:#8cc97f; --accent-soft:#283a24; --warn:#f0a070; --warn-soft:#3a2619;
    --d:#e3b14e; --l:#8cc97f; --c:#86aee0; --s:#c79ad6; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header h1{font-family:Fraunces,Georgia,serif;font-size:clamp(28px,5vw,44px);margin:0 0 4px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
h2{font-size:18px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:600;font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--surface2);user-select:none;transition:.15s}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.no input:checked + span{background:var(--warn);border-color:var(--warn)}
.chip.fav input:checked + span{background:var(--d);border-color:var(--d)}
.star{color:var(--d)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:10px 18px;cursor:pointer}
.primary{background:var(--accent);color:var(--surface)}
.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.07)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:14px}
.cal-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.legend b{font-weight:500}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.langs button{padding:5px 10px;font-size:13px;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.langs button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.day{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px;cursor:pointer;text-align:left;color:var(--text);font:inherit;font-weight:400;display:flex;flex-direction:column;gap:3px;transition:.15s}
.day:hover{border-color:var(--accent);transform:translateY(-1px)}
.day.empty{background:transparent;border:none;cursor:default;transform:none}
.day .num{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.day .num em{font-style:normal;font-weight:500;color:var(--muted);font-size:11px}
.meal{font-size:11.5px;line-height:1.3;padding-left:7px;border-left:3px solid;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.today{outline:2px solid var(--accent)}
dialog{border:none;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-head h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
.dlg-body{padding:6px 20px 20px}
.recipe{padding:14px 0;border-bottom:1px solid var(--line)}
.recipe:last-child{border:none}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.recipe h4{margin:2px 0 6px;font-size:17px}
.macro{font-size:13px;color:var(--muted)}
.recipe ul{margin:8px 0;padding-left:18px}
.recipe p{margin:6px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--surface)}
.shop{columns:2 240px;gap:24px;padding-left:18px;margin:6px 0 0}
.shop li{break-inside:avoid;margin-bottom:4px}
.shop li span{color:var(--muted);font-size:12.5px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sec-head h2{margin:0 0 4px}
.toggle{flex:none;width:36px;height:36px;padding:0;border-radius:50%;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:16px;line-height:1}
.chev{display:inline-block;transition:transform .2s}
.card.closed .chev{transform:rotate(-90deg)}
.card.closed .sec-body,.card.closed .sec-head .hint{display:none}
.sec-body{margin-top:14px}
.small{padding:7px 14px;font-size:13px}
.day.ok{background:var(--accent-soft);border-color:var(--accent)}
.day.ko{background:var(--warn-soft);border-color:var(--warn)}
.marks{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.mk{flex:1;padding:4px 0;font-size:12px;font-weight:600;border-radius:8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.mk.y.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mk.n.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.dlg-marks{display:flex;gap:8px;margin:12px 0 4px}
.dlg-marks .mk{flex:none;padding:8px 14px;font-size:13.5px}
.bars{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 12px;align-items:center}
.bars .lbl{font-size:13.5px;color:var(--text);text-align:right}
.bars .track{position:relative;height:22px;cursor:default}
.bars .bar{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px;transition:width .3s}
.bars .track:hover .bar{filter:brightness(1.12)}
.bars .val{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);padding-left:6px;white-space:nowrap}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;box-shadow:var(--shadow)}
.money{display:flex;align-items:center;gap:8px}
.money input{max-width:140px}
.money span{color:var(--muted);font-size:13.5px;white-space:nowrap}
.money b{font-weight:500}
.budget-bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.budget-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.budget-bar.over i{background:var(--warn)}
.okmsg{color:var(--accent);font-weight:600}
.overmsg{color:var(--warn);font-weight:600}
.shop-total{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;margin-top:6px}
.cost{color:var(--muted);font-size:12.5px}
footer{color:var(--muted);font-size:12.5px;margin-top:28px;text-align:center}
@media (max-width:760px){
  .cal{grid-template-columns:1fr}
  .dow,.day.empty{display:none}
  .day{min-height:auto}
  .meal{-webkit-line-clamp:1}
}
@media print{
  #prefs,.row,.tabs,footer,.toggle,.marks{display:none}
  .card.closed .sec-body{display:block}
  body{background:#fff}
  .card{box-shadow:none;border:none}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="langs" id="langs"></div>
  <h1 data-i="title"></h1>
  <p data-i="subtitle"></p>
  <div class="row" style="margin-top:12px">
    <button class="ghost small" id="openAll" data-i="openAll"></button>
    <button class="ghost small" id="closeAll" data-i="closeAll"></button>
  </div>
</header>

<section class="card" id="prefs" data-sec="prefs">
  <div class="sec-head"><div><h2 data-i="s1"></h2><p class="hint" data-i="s1hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
  <div class="grid2">
    <fieldset><legend data-i="diet"></legend><div class="chips" id="diet"></div></fieldset>
    <fieldset><legend data-i="goal"></legend><div class="chips" id="goal"></div></fieldset>
    <fieldset><legend data-i="protLvl"></legend><div class="chips" id="prot"></div></fieldset>
    <fieldset><legend data-i="meals"></legend><div class="chips" id="meals"></div></fieldset>
    <fieldset><legend data-i="start"></legend><input type="date" id="start"></fieldset>
    <fieldset><legend data-i="budget"></legend><div class="money"><input type="number" id="budget" min="0" step="5" inputmode="decimal"><span>€ / <b data-i="weekLow"></b></span></div></fieldset>
    <fieldset><legend data-i="country"></legend><div class="chips" id="country"></div></fieldset>
  </div>
  <fieldset style="margin-top:20px"><legend data-i="dislikes"></legend><div class="chips" id="dislikes"></div></fieldset>
  <fieldset style="margin-top:20px"><legend data-i="favs"></legend><div class="chips" id="favs"></div></fieldset>
  <fieldset style="margin-top:16px"><legend data-i="otherFavs"></legend><input type="text" id="customFav"></fieldset>
  <fieldset style="margin-top:16px"><legend data-i="otherAvoid"></legend><input type="text" id="custom"></fieldset>
  <div class="row">
    <button class="primary" id="gen" data-i="gen"></button>
    <button class="ghost" id="shuffle" data-i="shuffle"></button>
    <button class="ghost" id="reset" data-i="reset"></button>
  </div>
  </div>
</section>

<section class="card" data-sec="summary">
  <div class="sec-head"><h2 data-i="summary"></h2><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body" id="summary"></div>
</section>

<section class="card" data-sec="cal">
  <div class="sec-head">
    <div><h2 data-i="s2"></h2><p class="hint" style="margin:0" data-i="s2hint"></p></div>
    <button class="toggle" aria-expanded="true"><span class="chev">▾</span></button>
  </div>
  <div class="sec-body">
    <div class="legend" style="margin-top:12px">
      <span><i class="dot" style="background:var(--d)"></i><b data-t="d"></b></span>
      <span><i class="dot" style="background:var(--l)"></i><b data-t="l"></b></span>
      <span><i class="dot" style="background:var(--s)"></i><b data-t="s"></b></span>
      <span><i class="dot" style="background:var(--c)"></i><b data-t="c"></b></span>
      <span>✓ <b data-i="doneLbl"></b></span>
      <span>✗ <b data-i="missedLbl"></b></span>
    </div>
    <div class="cal" id="cal"></div>
  </div>
</section>

<section class="card" data-sec="chart">
  <div class="sec-head"><div><h2 data-i="s4"></h2><p class="hint" style="margin:0" data-i="s4hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
    <div class="tabs" id="chartTabs"></div>
    <div class="stats" id="chartStats"></div>
    <p class="hint" id="chartNote" style="margin:14px 0 6px"></p>
    <div class="bars" id="chart" role="img"></div>
    <div class="tip" id="tip" hidden></div>
  </div>
</section>

<section class="card" data-sec="shop">
  <div class="sec-head"><div><h2 data-i="s3"></h2><p class="hint" style="margin:0" data-i="s3hint"></p></div><button class="toggle" aria-expanded="true"><span class="chev">▾</span></button></div>
  <div class="sec-body">
    <div class="tabs" id="weekTabs"></div>
    <div id="shopTotal"></div>
    <ul class="shop" id="shop" style="margin-top:14px"></ul>
  </div>
</section>

<footer data-i="footer"></footer>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlgTitle"></h3><button class="ghost" id="close" aria-label="Cerrar">✕</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<script src="recetas-i18n.js"></script>

function priceLine(line){

const userWords = s => norm(s||"").split(",").map(w=>w.trim()).filter(Boolean);

function allowed(type, idx){
  const rec = R[type][idx];
  let flags = "", words = [];
  state.diet.forEach(d => flags += (DIETS.find(x=>x[0]===d)||["",""])[1]);
  if(state.diet.includes("vegan")) words.push("miel");
  state.dislikes.forEach(id => { const d = DISLIKES.find(x=>x[0]===id); if(d){ flags += d[1]; words.push(...d[2]); } });
  words.push(...userWords(state.custom));
  if([...rec[1]].some(f => flags.includes(f))) return false;
  const text = searchText(type, idx);
  return !words.some(w => wordRe(w).test(text));
}

function isFav(type, idx){
  const key = type+idx+"|"+state.favs.join()+"|"+state.customFav+"|"+state.lang;
  if(key in favCache) return favCache[key];
  return favCache[key] = rawFav(type, idx);
}
function rawFav(type, idx){
  const words = [];
  state.favs.forEach(id => { const f = FAVS.find(x=>x[0]===id); if(f) words.push(...f[1]); });
  words.push(...userWords(state.customFav));
  const text = searchText(type, idx);
  return words.some(w => wordRe(w).test(text));
}

/* cuántas veces entra una receta en cada ronda: favoritos ×3, y según el nivel de proteína */
function weight(type, idx){
  const r = R[type][idx], ratio = r[3]*4 / r[2];
  let w = isFav(type, idx) ? 3 : 1;
  if(state.protein === "mas") w *= ratio >= 0.3 ? 3 : ratio >= 0.2 ? 2 : 1;
  if(state.protein === "menos") w *= ratio < 0.15 ? 3 : ratio < 0.25 ? 2 : 1;
  return w;
}

function rng(seed){ return () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
function shuffle(arr, rand){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* el plan guarda índices de receta, así cambia de idioma sin cambiar el menú */
let plan = [], pools = {};
function generate(){
  const rand = rng(state.seed * 7919 + 13);
  pools = {}; plan = [];
  const queues = {};
  state.meals.forEach(t => { pools[t] = R[t].map((_,i)=>i).filter(i => allowed(t,i)); queues[t] = []; });
  for(let i=0;i<30;i++){
    const day = {};
    state.meals.forEach(t => {
      if(!pools[t].length){ day[t]=null; return; }
      if(!queues[t].length){
        // los favoritos entran 3 veces en cada ronda, así salen más a menudo
        const weighted = pools[t].flatMap(r => Array(weight(t,r)).fill(r));
        const q = shuffle(weighted, rand);
        for(let k=1;k<q.length;k++) if(q[k]===q[k-1]){ const j=q.findIndex((x,idx)=>idx>k && x!==q[k]); if(j>0) [q[k],q[j]]=[q[j],q[k]]; }
        queues[t] = q;
      }
      let pick = queues[t].shift();
      const prev = plan[i-1] && plan[i-1][t];
      if(prev === pick && queues[t].length){ queues[t].push(pick); pick = queues[t].shift(); }
      day[t] = pick;
    });
    plan.push(day);
  }
  fitBudget();
}

const weekDays = w => plan.map((_,k)=>k).slice(w*7, w*7+7);
const dayCost = day => state.meals.reduce((a,x)=>a+(day[x]!=null?cost(x,day[x]):0),0);
const weekCost = w => weekDays(w).reduce((a,k)=>a+dayCost(plan[k]),0);
const budgetFor = w => parseFloat(state.budget) * weekDays(w).length / 7;
let overWeeks = [];
/* cambia las comidas más caras por alternativas más baratas hasta que cada semana entra en el presupuesto */
function fitBudget(){
  overWeeks = [];
  const b = parseFloat(state.budget);
  if(!(b > 0)) return;
  for(let w=0; w<Math.ceil(30/7); w++){
    let guard = 0;
    while(weekCost(w) > budgetFor(w) && guard++ < 200){
      let best = null;
      weekDays(w).forEach(k => state.meals.forEach(x => {
        const cur = plan[k][x]; if(cur==null) return;
        const cc = cost(x,cur);
        const prev = plan[k-1] && plan[k-1][x], next = plan[k+1] && plan[k+1][x];
        const used = new Set(weekDays(w).map(j => plan[j][x]));
        const cands = pools[x].filter(r => r!==prev && r!==next && cost(x,r) < cc - 0.05);
        if(!cands.length) return;
        // preferir alternativas no repetidas en la semana y favoritas
        cands.sort((a,c) => (used.has(a)-used.has(c)) || (isFav(x,c)-isFav(x,a)) || (cost(x,c)-cost(x,a)));
        const alt = cands[0], saving = cc - cost(x,alt);
        if(!best || saving > best.saving) best = {k, x, alt, saving};
      }));
      if(!best) break;
      plan[best.k][best.x] = best.alt;
    }
    if(weekCost(w) > budgetFor(w) + 0.01) overWeeks.push(w);
  }
}

const mult = () => (GOALS.find(g=>g[0]===state.goal)||GOALS[1])[1];
const dayDate = i => { const d = new Date(state.start+"T12:00:00"); d.setDate(d.getDate()+i); return d; };
const fmt = (d,o) => d.toLocaleDateString(LOCALE[state.lang], o);
const sumDay = (day, k) => state.meals.reduce((a,t)=>a+(day[t]!=null?macros(t,day[t])[k-2]:0),0);

function renderSummary(){
  const m = mult(), i = L();
  const kcal = plan.reduce((a,d)=>a+sumDay(d,2),0)/30*m;
  const prot = plan.reduce((a,d)=>a+sumDay(d,3),0)/30*m;
  const missing = state.meals.filter(t => !pools[t].length).map(t=>TYPES[t][i]);
  const n = state.meals.reduce((a,t)=>a+pools[t].length,0);
  $("summary").innerHTML = `<p class="hint" style="margin-top:0">${t(state.goal)} ${state.protein==="mas"?t("protMas"):state.protein==="menos"?t("protMenos"):""} ${t("adjusted")}</p>
  <div class="stats">
    <div class="stat"><b>${Math.round(kcal)}</b><small>${t("kcalDay")}</small></div>
    <div class="stat"><b>${Math.round(prot)} g</b><small>${t("protDay")}</small></div>
    <div class="stat"><b>${plan.filter((_,k)=>state.done[dkey(k)]==="y").length}/30</b><small>${t("daysDone")}</small></div>
    <div class="stat"><b>${money(plan.reduce((a,d)=>a+dayCost(d),0)/30*7)}</b><small>${t("perWeek")}</small></div>
    <div class="stat"><b>${n}</b><small>${t("compat")}</small></div>
    <div class="stat"><b>${fmt(dayDate(0),{day:"numeric",month:"short"})} – ${fmt(dayDate(29),{day:"numeric",month:"short"})}</b><small>${t("days30")}</small></div>
  </div>
  ${parseFloat(state.budget)>0 ? `<p class="hint" style="margin:12px 0 0">${t("budgetAdj")}</p>` : ""}
  ${overWeeks.length ? `<div class="alert">${t("over")} (${overWeeks.map(w=>t("week")+" "+(w+1)).join(", ")}). ${t("overHint")}</div>` : ""}
  ${missing.length ? `<div class="alert">${t("noRecipes")} <b>${missing.join(", ")}</b>. ${t("tryRemove")}</div>` : ""}
  ${!missing.length && state.meals.some(x=>pools[x].length<5) ? `<div class="alert">${t("few")}</div>` : ""}`;
}

const star = (type, idx) => isFav(type, idx) ? '<span class="star">★</span> ' : '';

function renderCalendar(){
  const cal = $("cal"); cal.innerHTML = "";
  UI.dow[L()].forEach(d => cal.insertAdjacentHTML("beforeend",`<div class="dow">${d}</div>`));
  const offset = (dayDate(0).getDay()+6)%7;
  for(let i=0;i<offset;i++) cal.insertAdjacentHTML("beforeend",`<div class="day empty"></div>`);
  const todayStr = new Date().toDateString();
  plan.forEach((day,i) => {
    const d = dayDate(i);
    const st = state.done[dkey(i)];
    const b = document.createElement("div");
    b.className = "day" + (d.toDateString()===todayStr ? " today":"") + (st==="y"?" ok":st==="n"?" ko":"");
    b.tabIndex = 0; b.setAttribute("role","button");
    b.innerHTML = `<div class="num">${fmt(d,{weekday:"short",day:"numeric",month:"short"})}<em>${t("day")} ${i+1}</em></div>` +
      state.meals.map(x => day[x]!=null ? `<div class="meal" style="border-color:${COLORS[x]}">${star(x,day[x])}${tr(x,day[x])[0]}</div>` : "").join("") +
      marksHTML(i);
    b.onclick = e => { const m = e.target.closest(".mk"); if(m){ e.stopPropagation(); mark(i, m.dataset.v); } else openDay(i); };
    b.onkeydown = e => { if((e.key==="Enter"||e.key===" ") && e.target===b){ e.preventDefault(); openDay(i); } };
    cal.appendChild(b);
  });
}

const pad = n => String(n).padStart(2,"0");
const dkey = i => { const d = dayDate(i); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function marksHTML(i){
  const st = state.done[dkey(i)];
  return `<div class="marks"><button class="mk y ${st==="y"?"on":""}" data-v="y" title="${t("doneLbl")}" aria-pressed="${st==="y"}">✓</button><button class="mk n ${st==="n"?"on":""}" data-v="n" title="${t("missedLbl")}" aria-pressed="${st==="n"}">✗</button></div>`;
}
function mark(i, v){
  const k = dkey(i);
  if(state.done[k] === v) delete state.done[k]; else state.done[k] = v;
  save(); renderCalendar(); renderSummary(); renderChart();
  if($("dlg").open && openIdx===i) openDay(i);
}

function scaleQty(line, m, isP){
  if(isP) m *= pFactor();
  if(m===1) return line;
  if(/^\d+(?:[.,]\d+)?\s*(g|ml)\b/.test(line))
    return line.replace(/^(\d+(?:[.,]\d+)?)/, n => Math.round(parseFloat(n.replace(",","."))*m/5)*5);
  if(isP) return line.replace(/^(\d+)(?=\s)/, n => Math.max(1, Math.round(+n*m)));
  return line;
}

let openIdx = null;
function openDay(i){
  openIdx = i;
  const m = mult(), day = plan[i], li = L();
  $("dlgTitle").textContent = `${t("day")} ${i+1} · ${fmt(dayDate(i),{weekday:"long",day:"numeric",month:"long"})}`;
  const st = state.done[dkey(i)];
  $("dlgBody").innerHTML = `<p class="macro" style="margin-bottom:0">${t("markDay")}</p><div class="dlg-marks"><button class="mk y ${st==="y"?"on":""}" data-v="y" aria-pressed="${st==="y"}">✓ ${t("doneLbl")}</button><button class="mk n ${st==="n"?"on":""}" data-v="n" aria-pressed="${st==="n"}">✗ ${t("missedLbl")}</button></div><p class="macro">${t("total")} <b>${Math.round(sumDay(day,2)*m)} kcal</b> · ${t("dayCost")} <b>${money(dayCost(day))}</b></p>` + state.meals.map(x => {
    if(day[x]==null) return `<div class="recipe"><span class="tag" style="color:${COLORS[x]}">${TYPES[x][li]}</span><p>${t("none")}</p></div>`;
    const r = tr(x, day[x]), mc = macros(x, day[x]), es = R[x][day[x]][4];
    return `<div class="recipe"><span class="tag" style="color:${COLORS[x]}">${TYPES[x][li]}</span><h4>${star(x,day[x])}${r[0]}</h4>
      <div class="macro">${Math.round(mc[0]*m)} kcal · ${Math.round(mc[1]*m)} g ${t("protein")} · ≈ ${money(cost(x,day[x]))}</div>
      <ul>${r[4].map((y,k)=>`<li>${scaleQty(y,m,isProtIng(es[k]))}</li>`).join("")}</ul><p>${r[5]}</p></div>`;
  }).join("");
  if(!$("dlg").open) $("dlg").showModal();
}

let week = 0;
const UNIT = /^[\d\/.,+\s]+(?:(g|ml|cdas?|cdtas?|tbsp|tsp|el|tl|cucchia(?:i|io|ino)(?: di| d')?|cacito|scoop|schepje|misurino(?: di)?)\b)?\s*/i;
function renderShop(){
  const weeks = Math.ceil(30/7);
  $("weekTabs").innerHTML = Array.from({length:weeks},(_,w)=>`<button class="ghost ${w===week?"on":""}" data-w="${w}">${t("week")} ${w+1}</button>`).join("");
  $("weekTabs").querySelectorAll("button").forEach(b => b.onclick = () => { week = +b.dataset.w; renderShop(); });
  const count = {}, costs = {}, m = mult(), f = pFactor(), cf = cFactor();
  plan.slice(week*7, week*7+7).forEach(day => state.meals.forEach(x => { if(day[x]==null) return; const es = R[x][day[x]][4]; tr(x,day[x])[4].forEach((y,k) => {
    const name = y.replace(UNIT,"").trim();
    const key = name.charAt(0).toUpperCase()+name.slice(1);
    count[key] = (count[key]||0)+1;
    costs[key] = (costs[key]||0) + priceLine(es[k]) * m * (isProtIng(es[k]) ? f : 1) * cf;
  }); }));
  $("shop").innerHTML = Object.entries(count).sort((a,b)=>a[0].localeCompare(b[0],state.lang))
    .map(([k,v])=>`<li>${k} <span>×${v} · ${money(costs[k])}</span></li>`).join("") || `<li>${t("noIngr")}</li>`;
  const total = weekCost(week), b = parseFloat(state.budget);
  let html = `<div class="shop-total"><span>${t("estTotal")} <b>${money(total)}</b></span>`;
  if(b > 0){
    const bw = budgetFor(week), pct = Math.min(100, total/bw*100), over = total > bw + 0.01;
    html += `<span class="${over?"overmsg":"okmsg"}">${over ? `${t("over")} ${money(total-bw)}` : t("within")} · ${money(bw)}</span></div>
      <div class="budget-bar ${over?"over":""}"><i style="width:${pct}%"></i></div><p class="hint" style="margin:0">${Math.round(total/bw*100)} % ${t("ofBudget")}</p>`;
  } else html += `</div>`;
  $("shopTotal").innerHTML = html + `<p class="hint" style="margin:8px 0 0">${t("priceNote")}</p>`;
}

let chartRange = "m";
function groupOf(line){
  const n = norm(line);
  const g = GROUPS.find(g => g[1].some(w => wordRe(w).test(n)));
  return g ? g[0] : null;
}
function renderChart(){
  const li = L(), weeks = Math.ceil(30/7);
  const ranges = [...Array.from({length:weeks},(_,w)=>[String(w),`${t("week")} ${w+1}`]), ["m",t("month")]];
  $("chartTabs").innerHTML = ranges.map(([v,l])=>`<button class="ghost ${v===chartRange?"on":""}" data-r="${v}">${l}</button>`).join("");
  $("chartTabs").querySelectorAll("button").forEach(b => b.onclick = () => { chartRange = b.dataset.r; renderChart(); });
  const idx = chartRange==="m" ? plan.map((_,k)=>k) : plan.map((_,k)=>k).slice(+chartRange*7, +chartRange*7+7);
  const done = idx.filter(k => state.done[dkey(k)]==="y"), missed = idx.filter(k => state.done[dkey(k)]==="n");
  const use = done.length ? done : idx;
  $("chartStats").innerHTML = `<div class="stat"><b>✓ ${done.length}</b><small>${t("daysDone")}</small></div>
    <div class="stat"><b>✗ ${missed.length}</b><small>${t("daysMissed")}</small></div>
    <div class="stat"><b>${idx.length-done.length-missed.length}</b><small>${t("daysOpen")}</small></div>`;
  $("chartNote").textContent = done.length ? t("doneNote").replace("{n}", done.length) : t("planNote");
  const count = {};
  use.forEach(k => state.meals.forEach(x => { const r = plan[k][x]; if(r!=null) R[x][r][4].forEach(line => { const g = groupOf(line); if(g) count[g]=(count[g]||0)+1; }); }));
  const total = Object.values(count).reduce((a,b)=>a+b,0) || 1;
  const rows = GROUPS.map(g => [g, count[g[0]]||0]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  const max = rows.length ? rows[0][1] : 1;
  $("chart").setAttribute("aria-label", t("chartAria"));
  $("chart").innerHTML = rows.map(([g,v]) => `<div class="lbl">${g[2][li]}</div>
    <div class="track" data-tip="${g[2][li]}: ${v} ${t("servings")} · ${Math.round(v/total*100)} % ${t("ofTotal")}">
      <div class="bar" style="width:calc((100% - 48px) * ${v/max})"></div>
      <span class="val" style="left:calc((100% - 48px) * ${v/max})">${v}</span></div>`).join("");
}
(function tooltip(){
  const tip = $("tip");
  $("chart").addEventListener("mousemove", e => {
    const tr_ = e.target.closest(".track");
    if(!tr_){ tip.hidden = true; return; }
    tip.textContent = tr_.dataset.tip; tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  $("chart").addEventListener("mouseleave", () => tip.hidden = true);
})();

function applySections(){
  document.querySelectorAll("[data-sec]").forEach(sec => {
    const closed = state.closed.includes(sec.dataset.sec);
    sec.classList.toggle("closed", closed);
    const b = sec.querySelector(".toggle");
    b.setAttribute("aria-expanded", String(!closed));
    b.title = closed ? t("open") : t("closeSec");
    b.setAttribute("aria-label", b.title);
  });
}
document.querySelectorAll("[data-sec]").forEach(sec => {
  const id = sec.dataset.sec;
  const toggle = () => { state.closed = state.closed.includes(id) ? state.closed.filter(x=>x!==id) : [...state.closed, id]; save(); applySections(); };
  sec.querySelector(".toggle").onclick = toggle;
  sec.querySelector(".sec-head h2").style.cursor = "pointer";
  sec.querySelector(".sec-head h2").onclick = toggle;
});
$("openAll").onclick = () => { state.closed = []; save(); applySections(); };
$("closeAll").onclick = () => { state.closed = [...document.querySelectorAll("[data-sec]")].map(s=>s.dataset.sec); save(); applySections(); };

function run(){
  readForm(); generate(); renderSummary(); renderCalendar(); renderChart(); renderShop(); applySections();
  if($("dlg").open && openIdx!=null) openDay(openIdx);
}

$("custom").value = state.custom;
$("customFav").value = state.customFav;
$("start").value = state.start;
$("budget").value = state.budget;
$("budget").placeholder = "—";
buildForm();
$("gen").onclick = () => { run(); $("summary").scrollIntoView({behavior:"smooth"}); };
$("shuffle").onclick = () => { state.seed++; run(); };
$("reset").onclick = () => {
  readForm();
  Object.assign(state, {diet:["omni"], goal:"mantener", protein:"normal", meals:["d","l","s","c"], dislikes:[], favs:[], custom:"", customFav:""});
  $("custom").value = ""; $("customFav").value = "";
  buildForm(); run();
};
$("close").onclick = () => $("dlg").close();
$("dlgBody").addEventListener("click", e => { const m = e.target.closest(".mk"); if(m && openIdx!=null) mark(openIdx, m.dataset.v); });
$("dlg").addEventListener("click", e => { if(e.target === $("dlg")) $("dlg").close(); });
run();
</script>
</body>
</html>
